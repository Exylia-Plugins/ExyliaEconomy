name: Bug report
description: Something does not work as it should.
labels: [ bug ]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: This plugin, ExyliaLib, and the server software and version.
      placeholder: ExyliaEconomy 1.0.0, ExyliaLib 1.227.0, Paper 1.21.4
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors
      description: Any stack trace from the console. Paste it whole.
      render: text
