name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The fixed name is what ExyliaLib's updater downloads: releases/latest/download/ExyliaEconomy.jar.
          cp "build/libs/ExyliaEconomy-${version}.jar" build/libs/ExyliaEconomy.jar
          gh release create "$GITHUB_REF_NAME" "build/libs/ExyliaEconomy-${version}.jar" build/libs/ExyliaEconomy.jar \
            --title "ExyliaEconomy ${version}" --generate-notes
