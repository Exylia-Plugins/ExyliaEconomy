# Where somebody's money went, in one currency.
#
# Written once, when it is missing, and never overwritten.
#
# Values: %currency% %history_owner% %history_size%
# Each movement: %entry_when% %entry_delta% %entry_reason% %entry_balance%

title: "{primary}&l%currency% {letters_black}» {highlight}%history_owner%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{letters_black}&lAÚN NO HAY NADA"
    lore:
      - ""
      - " {letters_black}▎ {letters}Solo las monedas que guarda este"
      - " {letters_black}▎ {letters}servidor tienen historial."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-44'

  item_template:
    material: "%entry_icon%"
    name: "%entry_delta%"
    lore:
      - ""
      - "{secondary}Movimiento:"
      - " {letters_black}▎ {letters}Quedó {letters_black}» {info}%entry_balance%"
      - " {letters_black}▎ {letters}Motivo {letters_black}» {highlight}%entry_reason%"
      - " {letters_black}▎ {letters}Cuándo {letters_black}» {info}%entry_when% ⌚"
      - ""

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PÁGINA ANTERIOR'
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lPÁGINA SIGUIENTE →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lVOLVER'
    lore:
      - ""
      - " {letters_black}▎ {letters}Vuelve a la billetera"
      - ""
      - "{warning}➥ Clic para volver"
      - ""
    actions:
      - "exyliaeconomy:economy_wallet %history_owner_id%"

