# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Where else one stored currency shows up: its board, the network and Vault.

title: "{primary}&lINTEGRACIONES {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  leaderboard:
    slot: 12
    material: "%leaderboard_material%"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Top</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}✎ Información"
      - " {letters}Si funcionan su top"
      - " {letters}y sus placeholders."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Actual{letters_black}: %leaderboard_status%"
      - ""
      - "{primary}{icon:click} Clic para alternar"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% leaderboard"

  networked:
    slot: 13
    material: "%networked_material%"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Alcance en la red</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}✎ Información"
      - " {letters}Qué servidores comparten un"
      - " {letters}saldo: todos, los del grupo"
      - " {letters}del servidor o solo este."
      - " {letters}Cada uno se guarda aparte."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Compartida en{letters_black}: %networked_status%"
      - "  {letters_black}· {info}{icon:compass} {letters}Existe en{letters_black}: %available_status%"
      - ""
      - "{primary}{icon:click} Clic para cambiar"
      - "{letters_black}Todos, grupo, servidor."
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% networked"

  vault:
    slot: 14
    material: "%vault_material%"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Economía de vault</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}✎ Información"
      - " {letters}La publica como la economía"
      - " {letters}Vault del servidor,"
      - " {letters}reemplazando la anterior."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Actual{letters_black}: %vault_status%"
      - ""
      - "{primary}{icon:click} Clic para alternar"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% vault"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>Moneda</gradient>"
    lore:
      - "{error}{icon:click} Clic para volver"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
