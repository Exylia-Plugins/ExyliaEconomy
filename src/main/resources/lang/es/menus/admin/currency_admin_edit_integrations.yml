# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Where else one stored currency shows up: its board, the network and Vault.

title: "{primary}&lINTEGRACIONES {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  leaderboard:
    slot: 11
    material: "%leaderboard_material%"
    name: "{primary}&lTOP"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Si funcionan su top"
      - " {letters_black}▎ {letters}y sus placeholders."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Actual {letters_black}» %leaderboard_status%"
      - ""
      - "{warning}➥ Clic para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% leaderboard"

  networked:
    slot: 13
    material: "%networked_material%"
    name: "{primary}&lCOMPARTIDA ENTRE SERVIDORES"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Activada: un saldo en toda la red;"
      - " {letters_black}▎ {letters}desactivada: uno por servidor. Cada uno"
      - " {letters_black}▎ {letters}se guarda aparte; al volver, se restaura."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Actual {letters_black}» %networked_status%"
      - ""
      - "{warning}➥ Clic para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% networked"

  vault:
    slot: 15
    material: "%vault_material%"
    name: "{primary}&lECONOMÍA DE VAULT"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}La publica como la economía Vault"
      - " {letters_black}▎ {letters}del servidor, reemplazando la anterior."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Actual {letters_black}» %vault_status%"
      - ""
      - "{warning}➥ Clic para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% vault"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lVOLVER"
    lore:
      - ""
      - " {letters_black}▎ {letters}Vuelve al resumen de la moneda."
      - ""
      - "{warning}➥ Clic para volver"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
