# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The interest one stored currency pays its holders.

title: "{primary}&lINTERÉS {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  interest:
    slot: 12
    material: "EXPERIENCE_BOTTLE"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Interés</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}✎ Información"
      - " {letters}Se paga a los jugadores"
      - " {letters}con el permiso de interés."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:gold} {letters}Tasa{letters_black}: {info}%currency_interest_rate%"
      - "  {letters_black}· {info}{icon:clock} {letters}Cada{letters_black}: {info}%currency_interest_interval%"
      - "  {letters_black}· {info}{icon:hopper} {letters}Máximo por pago{letters_black}: {info}%currency_interest_max%"
      - ""
      - "{primary}» Clic para editar"
    actions:
      - "exyliaeconomy:currency_admin_interest %currency_id%"

  interest-offline:
    slot: 14
    material: "%interest_offline_material%"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Interés sin conexión</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}✎ Información"
      - " {letters}También paga a quien"
      - " {letters}no está conectado, sin"
      - " {letters}comprobar su permiso."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Actual{letters_black}: %interest_offline_status%"
      - ""
      - "{primary}» Clic para alternar"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% interest_offline"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>Moneda</gradient>"
    lore:
      - "{error}» Clic para volver"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
