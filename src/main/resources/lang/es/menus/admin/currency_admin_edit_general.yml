# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The look of one currency: its names, amounts, icon and place in lists.

title: "{primary}&lGENERAL {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  icon:
    slot: 11
    material: "%currency_icon%"
    name: "{primary}&lICONO"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Cómo la muestran billeteras y listas."
      - ""
      - "{warning}➥ Clic para elegir uno"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_icon %currency_id%"

  appearance:
    slot: 13
    material: "NAME_TAG"
    name: "{primary}&lAPARIENCIA"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Cómo se escribe cada cantidad."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Nombre {letters_black}» {letters}%currency_name%"
      - " {letters_black}▎ {letters}Plural {letters_black}» {letters}%currency_plural%"
      - " {letters_black}▎ {letters}Símbolo {letters_black}» {letters}%currency_symbol%"
      - " {letters_black}▎ {letters}Decimales {letters_black}» {info}%currency_decimals%"
      - " {letters_black}▎ {letters}Se ve así {letters_black}» {letters}%currency_preview%"
      - " {letters_black}▎ {letters}Compacta {letters_black}» {letters}%currency_preview_compact%"
      - ""
      - "{warning}➥ Clic para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_appearance %currency_id%"

  sort-order:
    slot: 15
    material: "HOPPER"
    name: "{primary}&lORDEN"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Menor se muestra primero en las listas."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Actual {letters_black}» {info}%currency_sort_order%"
      - ""
      - "{warning}➥ Clic para definirlo"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_sort %currency_id%"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lVOLVER"
    lore:
      - ""
      - " {letters_black}▎ {letters}Vuelve al resumen de la moneda."
      - ""
      - "{warning}➥ Clic para volver"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
