# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The look of one currency: its names, amounts, icon and place in lists.

title: "{primary}&lGENERAL {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  icon:
    slot: 12
    material: "%currency_icon%"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Icono</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cómo la muestran"
      - " {letters}billeteras y listas."
      - ""
      - "{primary}{icon:click} Clic para elegir uno"
    actions:
      - "exyliaeconomy:currency_admin_icon %currency_id%"

  appearance:
    slot: 13
    material: "NAME_TAG"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Apariencia</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cómo se escribe cada cantidad."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}Nombre{letters_black}: {letters}%currency_name%"
      - "  {letters_black}· {info}{icon:tag} {letters}Plural{letters_black}: {letters}%currency_plural%"
      - "  {letters_black}· {info}{icon:tag} {letters}Símbolo{letters_black}: {letters}%currency_symbol%"
      - "  {letters_black}· {info}{icon:iron} {letters}Decimales{letters_black}: {info}%currency_decimals%"
      - "  {letters_black}· {info}{icon:eye} {letters}Se ve así{letters_black}: {letters}%currency_preview%"
      - "  {letters_black}· {info}{icon:eye} {letters}Compacta{letters_black}: {letters}%currency_preview_compact%"
      - ""
      - "{primary}{icon:click} Clic para editar"
    actions:
      - "exyliaeconomy:currency_admin_appearance %currency_id%"

  sort-order:
    slot: 14
    material: "HOPPER"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Orden</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}✎ Información"
      - " {letters}Menor se muestra"
      - " {letters}primero en las listas."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:iron} {letters}Actual{letters_black}: {info}%currency_sort_order%"
      - ""
      - "{primary}{icon:click} Clic para definirlo"
    actions:
      - "exyliaeconomy:currency_admin_sort %currency_id%"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>Moneda</gradient>"
    lore:
      - "{error}{icon:click} Clic para volver"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
