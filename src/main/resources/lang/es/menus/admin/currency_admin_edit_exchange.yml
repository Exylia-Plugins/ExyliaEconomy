      - "{warning}➥ Clic para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% exchangeable"

  rates:
    slot: 14
    material: "SUNFLOWER"
    name: "{primary}&lTASAS DE CAMBIO"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}shards=0.01: 1 de esta vale"
      - " {letters_black}▎ {letters}0.01 shards. Solo se usa"
      - " {letters_black}▎ {letters}con el cambio activo."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Tasas {letters_black}» {info}%currency_rates%"
