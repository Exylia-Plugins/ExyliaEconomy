# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How one stored currency moves between players.

title: "{primary}&lPAGOS {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  transferable:
    slot: 12
    material: "%transferable_material%"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Transferencias</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}✎ Información"
      - " {letters}Si los jugadores pueden"
      - " {letters}pagarse entre sí."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Actual{letters_black}: %transferable_status%"
      - ""
      - "{primary}{icon:click} Clic para alternar"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% transferable"

  pay-confirm:
    slot: 13
    material: "PAPER"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Confirmación de pago</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}✎ Información"
      - " {letters}Un /pay por encima"
      - " {letters}pide confirmación."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:hopper} {letters}Pregunta desde{letters_black}: {info}%currency_pay_confirm%"
      - ""
      - "{primary}{icon:click} Clic para editar"
    actions:
      - "exyliaeconomy:currency_admin_pay_confirm %currency_id%"

  banknotes:
    slot: 14
    material: "%banknotes_material%"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Billetes</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}✎ Información"
      - " {letters}Si /withdraw puede"
      - " {letters}emitirla como billete."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Actual{letters_black}: %banknotes_status%"
      - ""
      - "{primary}{icon:click} Clic para alternar"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% banknotes"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>Moneda</gradient>"
    lore:
      - "{error}{icon:click} Clic para volver"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
