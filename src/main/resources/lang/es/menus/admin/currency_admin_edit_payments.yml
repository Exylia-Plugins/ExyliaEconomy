# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How one stored currency moves between players.

title: "{primary}&lPAGOS {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  transferable:
    slot: 11
    material: "%transferable_material%"
    name: "{primary}&lTRANSFERENCIAS"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Si los jugadores pueden pagarse entre sí."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Actual {letters_black}» %transferable_status%"
      - ""
      - "{warning}➥ Clic para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% transferable"

  pay-confirm:
    slot: 13
    material: "PAPER"
    name: "{primary}&lCONFIRMACIÓN DE PAGO"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Un /pay por encima pide confirmación."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Pregunta desde {letters_black}» {info}%currency_pay_confirm%"
      - ""
      - "{warning}➥ Clic para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_pay_confirm %currency_id%"

  banknotes:
    slot: 15
    material: "%banknotes_material%"
    name: "{primary}&lBILLETES"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Si /withdraw puede emitirla como billete."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Actual {letters_black}» %banknotes_status%"
      - ""
      - "{warning}➥ Clic para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% banknotes"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lVOLVER"
    lore:
      - ""
      - " {letters_black}▎ {letters}Vuelve al resumen de la moneda."
      - ""
      - "{warning}➥ Clic para volver"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
