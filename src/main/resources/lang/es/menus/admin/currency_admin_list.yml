# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every currency the server runs, kept in the database. /economyadmin

title: "{primary}&lMONEDAS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay más monedas"
    lore:
      - "{letters_black}Crea una con el botón de abajo."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%currency_icon%"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>%currency_name%</gradient>"
    lore:
      - "{letters_black}Moneda · %currency_id%"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}Tipo{letters_black}: {info}%currency_kind%"
      - "  {letters_black}· {info}{icon:iron} {letters}Orden{letters_black}: {info}%currency_sort_order%"
      - ""
      - "{primary}✦ Vista previa"
      - "  {letters_black}· {info}{icon:eye} {letters}Se ve así{letters_black}: {letters}%currency_preview%"
      - ""
      - "{primary}» Clic izquierdo {letters_black}· {letters}editar"
      - "{error}» Clic derecho {letters_black}· {letters}eliminar"
      - "{letters_black}Se te pedirá confirmación."
    actions:
      - "left: exyliaeconomy:currency_admin_edit %currency_id%"
      - "right: exyliaeconomy:currency_admin_delete %currency_id%"

  navigation:
