      - "exyliaeconomy:currency_admin_create"

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Plugin {letters_black}▸ <gradient:{primary}:{secondary_light}>Ajustes de economía</gradient>"
    lore:
      - "{letters_black}Configuración"
      - ""
      - "{primary}✎ Información"
      - " {letters}Monedas de experiencia,"
      - " {letters}el registro, Vault,"
      - " {letters}idioma y depuración."
      - ""
      - "{primary}» Clic para abrir"
