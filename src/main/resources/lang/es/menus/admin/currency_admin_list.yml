items:
  create:
    slot: 45
    material: "EMERALD_BLOCK"
    name: "{letters}Monedas {letters_black}▸ <gradient:{success}:{success_light}>Crear moneda</gradient>"
    lore:
      - "{letters_black}Nueva moneda"
      - ""
      - "{success}✦ Tipos"
      - "  {letters_black}· {highlight}Almacenada{letters_black}: {letters}saldos en la base de datos"
      - "  {letters_black}· {highlight}Ítem{letters_black}: {letters}un ítem exacto que llevan los jugadores"
      - "  {letters_black}· {highlight}Solo visual{letters_black}: {letters}reviste la de otro plugin"
