      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Transferencias{letters_black}: %transferable_status%"
      - "  {letters_black}· {info}{icon:hopper} {letters}Pregunta desde{letters_black}: {info}%currency_pay_confirm%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Billetes{letters_black}: %banknotes_status%"
