# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One currency: an overview that opens each section of it. A stored
# currency has every section; an item currency its item, commands and
# pay confirmation; a display-only one its look and pay confirmation.

title: "{primary}&lMONEDA {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  summary:
    slot: 4
    material: "%currency_icon%"
    name: "<gradient:{primary}:{secondary_light}>%currency_plural%</gradient>"
    lore:
      - "{letters_black}Resumen de la moneda"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%currency_id%"
      - "  {letters_black}· {info}{icon:tag} {letters}Tipo{letters_black}: {info}%currency_kind_label%"
      - ""
      - "{primary}✦ Vista previa"
      - "  {letters_black}· {info}{icon:eye} {letters}Completa{letters_black}: {letters}%currency_preview%"
      - "  {letters_black}· {info}{icon:eye} {letters}Compacta{letters_black}: {letters}%currency_preview_compact%"

  general:
    slot: 11
    material: "NAME_TAG"
    condition: "%currency_kind% == STORED"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>General</gradient>"
    lore:
      - "{letters_black}Sección de configuración"
      - ""
      - "{primary}✎ Información"
      - " {letters}Nombres, cantidades, icono y orden."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}Nombre{letters_black}: {info}%currency_name%"
      - ""
      - "{primary}{icon:click} Clic para abrir"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands:
    slot: 12
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == STORED"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Comandos</gradient>"
    lore:
      - "{letters_black}Sección de configuración"
      - ""
      - "{primary}✎ Información"
      - " {letters}Lo que escriben los"
      - " {letters}jugadores para usarla."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}Nombres{letters_black}: {info}%currency_aliases%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Activados{letters_black}: %commands_status%"
      - ""
      - "{primary}{icon:click} Clic para abrir"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% commands"

  rules:
    slot: 14
    material: "BOOK"
    condition: "%currency_kind% == STORED"
    name: "{letters}Moneda {letters_black}▸ <gradient:{primary}:{secondary_light}>Reglas</gradient>"
    lore:
      - "{letters_black}Ajuste de la moneda"
      - ""
      - "{primary}♦ Saldos"
      - "  {letters_black}· {info}{icon:gold} {letters}Inicial{letters_black}: {info}%currency_start%"
      - "  {letters_black}· {info}{icon:hopper} {letters}Tope{letters_black}: {info}%currency_max%"
      - "  {letters_black}· {info}{icon:key} {letters}Permiso{letters_black}: {info}%currency_permission%"
      - ""
      - "{primary}♦ Transferencias"
      - "  {letters_black}· {info}{icon:hopper} {letters}Mínimo{letters_black}: {info}%currency_minimum_transfer%"
      - "  {letters_black}· {info}{icon:gold} {letters}Impuesto{letters_black}: {info}%currency_tax%"
