# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One currency: an overview that opens each section of it. A stored
# currency has every section; an item currency its item, commands and
# pay confirmation; a display-only one its look and pay confirmation.

title: "{primary}&lMONEDA {letters_black}» {highlight}%currency_id%"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  summary:
    slot: 4
    material: "%currency_icon%"
    name: "{primary}&l%currency_plural%"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}ID {letters_black}» {info}%currency_id%"
      - " {letters_black}▎ {letters}Tipo {letters_black}» {info}%currency_kind_label%"
      - ""
      - "{secondary}Vista previa:"
      - " {letters_black}▎ {letters}Completa {letters_black}» {letters}%currency_preview%"
      - " {letters_black}▎ {letters}Compacta {letters_black}» {letters}%currency_preview_compact%"
      - ""

  general:
    slot: 19
    material: "NAME_TAG"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lGENERAL"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Nombres, cantidades, icono y orden."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Nombre {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Se ve así {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Clic para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands:
    slot: 20
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lCOMANDOS"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Lo que escriben los jugadores para usarla."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Nombres {letters_black}» {info}%currency_aliases%"
      - " {letters_black}▎ {letters}Activados {letters_black}» %commands_status%"
      - ""
      - "{warning}➥ Clic para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% commands"

  rules:
    slot: 21
    material: "BOOK"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lREGLAS"
    lore:
      - ""
      - "{secondary}Saldos:"
      - " {letters_black}▎ {letters}Inicial {letters_black}» {info}%currency_start%"
      - " {letters_black}▎ {letters}Tope {letters_black}» {info}%currency_max%"
      - " {letters_black}▎ {letters}Permiso {letters_black}» {info}%currency_permission%"
      - ""
      - "{secondary}Transferencias:"
      - " {letters_black}▎ {letters}Mínimo {letters_black}» {info}%currency_minimum_transfer%"
      - " {letters_black}▎ {letters}Impuesto {letters_black}» {info}%currency_tax%"
      - ""
      - "{warning}➥ Clic para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_rules %currency_id%"

  payments:
    slot: 22
    material: "GOLD_NUGGET"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lPAGOS"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Transferencias, confirmaciones y billetes."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Transferencias {letters_black}» %transferable_status%"
      - " {letters_black}▎ {letters}Pregunta desde {letters_black}» {info}%currency_pay_confirm%"
      - " {letters_black}▎ {letters}Billetes {letters_black}» %banknotes_status%"
      - ""
      - "{warning}➥ Clic para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% payments"

  exchange:
    slot: 23
    material: "SUNFLOWER"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lCAMBIO"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Cambiarla por otras monedas."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Cambio {letters_black}» %exchangeable_status%"
      - " {letters_black}▎ {letters}Tasas {letters_black}» {info}%currency_rates%"
      - ""
      - "{warning}➥ Clic para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% exchange"

  interest:
    slot: 24
    material: "EXPERIENCE_BOTTLE"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lINTERÉS"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Lo que paga a quien la tiene."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Tasa {letters_black}» {info}%currency_interest_rate%"
      - " {letters_black}▎ {letters}Cada {letters_black}» {info}%currency_interest_interval% ⌚"
      - " {letters_black}▎ {letters}Desconectados {letters_black}» %interest_offline_status%"
      - ""
      - "{warning}➥ Clic para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% interest"

  integrations:
    slot: 25
    material: "ENDER_EYE"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lINTEGRACIONES"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Su top, Vault y la red."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Top {letters_black}» %leaderboard_status%"
      - " {letters_black}▎ {letters}Red {letters_black}» %networked_status%"
      - " {letters_black}▎ {letters}Vault {letters_black}» %vault_status%"
      - ""
      - "{warning}➥ Clic para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% integrations"

  general-item:
    slot: 20
    material: "NAME_TAG"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lGENERAL"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Nombres, cantidades, icono y orden."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Nombre {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Se ve así {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Clic para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands-item:
    slot: 21
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lCOMANDOS"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}El primero es el comando;"
      - " {letters_black}▎ {letters}el resto, sus alias."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Nombres {letters_black}» {info}%currency_aliases%"
      - ""
      - "{warning}➥ Clic para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_aliases %currency_id%"

  item:
    slot: 23
    material: "%currency_item_icon%"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lÍTEM"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Solo cuentan los stacks idénticos:"
      - " {letters_black}▎ {letters}nombre, lore y modelo incluidos."
