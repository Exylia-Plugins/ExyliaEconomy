  general-display:
    slot: 21
    material: "NAME_TAG"
    condition: "%currency_kind% == DISPLAY"
    name: "{primary}&lGENERAL"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Nombres, cantidades, icono y orden."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Nombre {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Se ve así {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Clic para abrir"
      - ""
    actions:
