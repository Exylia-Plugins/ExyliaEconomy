# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Eine Währung: eine Übersicht, die jeden Bereich davon öffnet. Eine
# gespeicherte Währung hat alle Bereiche; eine Item-Währung ihr Item,
# Befehle und die Zahlungsbestätigung; eine reine Anzeigewährung ihr
# Aussehen und die Zahlungsbestätigung.

title: "{primary}&lWÄHRUNG {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  summary:
    slot: 4
    material: "%currency_icon%"
    name: "<gradient:{primary}:{secondary_light}>%currency_plural%</gradient>"
    lore:
      - "{letters_black}Währungsübersicht"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%currency_id%"
      - "  {letters_black}· {info}{icon:tag} {letters}Art{letters_black}: {info}%currency_kind_label%"
      - ""
      - "{primary}✦ Vorschau"
      - "  {letters_black}· {info}{icon:eye} {letters}Voll{letters_black}: {letters}%currency_preview%"
      - "  {letters_black}· {info}{icon:eye} {letters}Kompakt{letters_black}: {letters}%currency_preview_compact%"

  general:
    slot: 11
    material: "NAME_TAG"
    condition: "%currency_kind% == STORED"
    name: "{letters}Währung {letters_black}▸ <gradient:{primary}:{secondary_light}>Allgemein</gradient>"
    lore:
      - "{letters_black}Einrichtungsbereich"
      - ""
      - "{primary}✎ Information"
      - " {letters}Namen, Beträge, Icon und Reihenfolge."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Name{letters_black}: {info}%currency_name%"
      - ""
      - "{primary}{icon:click} Klicken zum Öffnen"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands:
    slot: 12
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == STORED"
    name: "{letters}Währung {letters_black}▸ <gradient:{primary}:{secondary_light}>Befehle</gradient>"
    lore:
