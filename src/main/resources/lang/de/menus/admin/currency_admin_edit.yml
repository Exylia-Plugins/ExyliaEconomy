      - ""
      - "{primary}✎ Information"
      - " {letters}Was Spieler tippen, um sie zu nutzen."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Namen{letters_black}: {info}%currency_aliases%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Aktiviert{letters_black}: %commands_status%"
      - ""
      - "{primary}{icon:click} Klicken zum Öffnen"
