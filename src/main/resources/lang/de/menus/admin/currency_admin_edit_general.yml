# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Das Aussehen einer Währung: Namen, Beträge, Icon und Platz in Listen.

title: "{primary}&lALLGEMEIN {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  icon:
    slot: 12
    material: "%currency_icon%"
    name: "{letters}Währung {letters_black}▸ <gradient:{primary}:{secondary_light}>Icon</gradient>"
    lore:
      - "{letters_black}Währungseinstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}So zeigen Wallets und Listen sie an."
      - ""
      - "{primary}{icon:click} Klicken zum Auswählen"
    actions:
      - "exyliaeconomy:currency_admin_icon %currency_id%"

  appearance:
    slot: 13
    material: "NAME_TAG"
    name: "{letters}Währung {letters_black}▸ <gradient:{primary}:{secondary_light}>Darstellung</gradient>"
    lore:
      - "{letters_black}Währungseinstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wie jeder Betrag geschrieben wird."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Name{letters_black}: {letters}%currency_name%"
      - "  {letters_black}· {info}{icon:tag} {letters}Plural{letters_black}: {letters}%currency_plural%"
      - "  {letters_black}· {info}{icon:tag} {letters}Symbol{letters_black}: {letters}%currency_symbol%"
      - "  {letters_black}· {info}{icon:iron} {letters}Dezimalstellen{letters_black}: {info}%currency_decimals%"
      - "  {letters_black}· {info}{icon:eye} {letters}Sieht aus wie{letters_black}: {letters}%currency_preview%"
