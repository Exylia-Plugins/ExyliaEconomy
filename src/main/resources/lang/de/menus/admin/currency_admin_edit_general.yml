      - "{primary}{icon:click} Klicken zum Bearbeiten"
    actions:
      - "exyliaeconomy:currency_admin_appearance %currency_id%"

  sort-order:
    slot: 14
    material: "HOPPER"
    name: "{letters}Währung {letters_black}▸ <gradient:{primary}:{secondary_light}>Reihenfolge</gradient>"
    lore:
      - "{letters_black}Währungseinstellung"
      - ""
