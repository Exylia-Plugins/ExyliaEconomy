    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  experience-levels:
    slot: 11
    material: "%experience_levels_material%"
    name: "{letters}Wirtschaft {letters_black}▸ <gradient:{primary}:{secondary_light}>Erfahrungslevel</gradient>"
    lore:
      - "{letters_black}Wirtschaftseinstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Macht xp_levels zu einer"
      - " {letters}Währung für Shop-Preise."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Aktuell{letters_black}: %experience_levels_status%"
      - ""
      - "{primary}{icon:click} Klicke zum Umschalten"
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle experience_levels"

  experience-points:
