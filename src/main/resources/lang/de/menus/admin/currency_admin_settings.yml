# DO NOT EDIT — WIRD BEI JEDEM START NEU GENERIERT.
#
# Die Schalter der Wirtschaft, die zu keiner einzelnen Währung gehören.

title: "{primary}&lWIRTSCHAFTSEINSTELLUNGEN"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
