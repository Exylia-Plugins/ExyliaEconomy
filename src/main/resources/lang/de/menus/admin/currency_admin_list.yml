# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Jede Währung, die der Server nutzt, gespeichert in der Datenbank. /economyadmin

title: "{primary}&lWÄHRUNGEN {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Keine weiteren Währungen"
    lore:
      - "{letters_black}Erstelle eine mit dem Button unten."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Erste Seite"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Letzte Seite →"

pagination:
  slots: '0-35'

  item_template:
    material: "%currency_icon%"
    name: "{letters}Währung {letters_black}▸ <gradient:{primary}:{secondary_light}>%currency_name%</gradient>"
    lore:
      - "{letters_black}Währung · %currency_id%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Art{letters_black}: {info}%currency_kind%"
      - "  {letters_black}· {info}{icon:iron} {letters}Reihenfolge{letters_black}: {info}%currency_sort_order%"
      - ""
      - "{primary}✦ Vorschau"
      - "  {letters_black}· {info}{icon:eye} {letters}Sieht aus wie{letters_black}: {letters}%currency_preview%"
      - ""
      - "{primary}{icon:click} Linksklick {letters_black}· {letters}bearbeiten"
      - "{error}{icon:right_click} Rechtsklick {letters_black}· {letters}löschen"
      - "{letters_black}Du musst es bestätigen."
    actions:
      - "left: exyliaeconomy:currency_admin_edit %currency_id%"
      - "right: exyliaeconomy:currency_admin_delete %currency_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
