# Die Wallet: alle Währungen, die jemand besitzt. /wallet
#
# Du kannst es frei gestalten: Änderungen bleiben bei Updates erhalten. Muss ein
# Release das Layout ändern, erhöht es unten menu-version; die Datei wird dann
# ersetzt und deine bisherige daneben aufbewahrt.
#
# Werte: %wallet_owner% %wallet_currencies%
# Pro Währung: %currency% %currency_icon% %currency_balance% %currency_kind%

menu-version: 3

title: "{primary}&lWALLET {letters_black}» {highlight}%wallet_owner% {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Keine weiteren Währungen"
    lore:
      - "{letters_black}Hier erscheinen Währungen, die du halten kannst."
    hide_tooltip: false
  custom:
    page_first:
      slots: '30'
      material: GRAY_DYE
      name: "{muted}← Erste Seite"
    page_last:
      slots: '32'
      material: GRAY_DYE
      name: "{muted}Letzte Seite →"

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%currency_icon%"
    name: "{letters}Wallet {letters_black}▸ <gradient:{info}:{info_light}>%currency%</gradient>"
    lore:
      - "{letters_black}Währung"
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Art{letters_black}: {info}%currency_kind%"
      - "  {letters_black}· {success}{icon:gold} {letters}Guthaben{letters_black}: {success}%currency_balance%"
      - ""
      - "{info}{icon:click} Linksklick {letters_black}· {letters}Verlauf"
      - "{info}{icon:right_click} Rechtsklick {letters_black}· {letters}Rangliste"
    actions:
      - "left: exyliaeconomy:economy_history %currency_id% %wallet_owner_id%"
      - "right: exyliaeconomy:economy_top %currency_id%"

  navigation:
    previous:
      slot: 30
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Seite {letters_black}▸ <gradient:{error}:{error_light}>← Zurück</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 32
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Seite {letters_black}▸ <gradient:{success}:{success_light}>Weiter →</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  owner:
    slot: 31
    material: "playerhead-%wallet_owner%"
    name: "<gradient:{info}:{info_light}>%wallet_owner%</gradient>"
    lore:
      - "{letters_black}Wallet"
      - ""
      - "{info}✎ Information"
      - " {letters}Alles, was diese Wallet"
      - " {letters}hält, auf diesem Server"
      - " {letters}und im ganzen Netzwerk."
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Währungen{letters_black}: {info}%wallet_currencies%"
