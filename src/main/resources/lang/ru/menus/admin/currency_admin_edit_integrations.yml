# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Where else one stored currency shows up: its board, the network and Vault.

title: "{primary}&lИНТЕГРАЦИИ {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  leaderboard:
    slot: 11
    material: "%leaderboard_material%"
    name: "{primary}&lРЕЙТИНГ"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Работают ли её топ"
      - " {letters_black}▎ {letters}и плейсхолдеры."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Сейчас {letters_black}» %leaderboard_status%"
      - ""
      - "{warning}➥ Нажми, чтобы переключить"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% leaderboard"

  networked:
    slot: 13
    material: "%networked_material%"
    name: "{primary}&lОБЩАЯ ДЛЯ СЕРВЕРОВ"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Вкл — один баланс на всю сеть;"
      - " {letters_black}▎ {letters}выкл — свой на сервер. Оба хранятся"
      - " {letters_black}▎ {letters}отдельно: переключение их вернёт."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Сейчас {letters_black}» %networked_status%"
      - ""
      - "{warning}➥ Нажми, чтобы переключить"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% networked"

  vault:
    slot: 15
    material: "%vault_material%"
    name: "{primary}&lЭКОНОМИКА VAULT"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Делает её экономикой Vault сервера,"
      - " {letters_black}▎ {letters}заменяя предыдущую."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Сейчас {letters_black}» %vault_status%"
      - ""
      - "{warning}➥ Нажми, чтобы переключить"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% vault"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lНАЗАД"
    lore:
      - ""
      - " {letters_black}▎ {letters}Возврат к обзору валюты."
      - ""
      - "{warning}➥ Нажми, чтобы вернуться"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
