# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Where else one stored currency shows up: its board, the network and Vault.

title: "{primary}&lИНТЕГРАЦИИ {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  leaderboard:
    slot: 12
    material: "%leaderboard_material%"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Рейтинг</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Работают ли её топ и плейсхолдеры."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Сейчас{letters_black}: %leaderboard_status%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы переключить"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% leaderboard"

  networked:
    slot: 13
    material: "%networked_material%"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Охват в сети</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Какие серверы делят один"
      - " {letters}баланс: все, серверы группы"
      - " {letters}или только этот."
      - " {letters}Каждый хранится отдельно."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:redstone} {letters}Общая для{letters_black}: %networked_status%"
      - "  {letters_black}· {info}{icon:compass} {letters}Есть на{letters_black}: %available_status%"
      - ""
      - "{primary}{icon:click} Нажмите, чтобы сменить"
      - "{letters_black}Все, группа, сервер."
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% networked"

  vault:
    slot: 14
    material: "%vault_material%"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Экономика vault</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Делает её экономикой Vault"
      - " {letters}сервера, заменяя предыдущую."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Сейчас{letters_black}: %vault_status%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы переключить"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% vault"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Валюта</gradient>"
    lore:
      - "{error}{icon:click} Нажми, чтобы вернуться"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
