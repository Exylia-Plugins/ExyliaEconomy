# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every currency the server runs, kept in the database. /economyadmin

title: "{primary}&lВАЛЮТЫ {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше нет валют"
    lore:
      - ""
      - " {letters_black}▎ {letters}Создай её кнопкой ниже."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%currency_icon%"
    name: "{primary}&l%currency_name%"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}ID {letters_black}» {info}%currency_id%"
      - " {letters_black}▎ {letters}Тип {letters_black}» {info}%currency_kind%"
      - " {letters_black}▎ {letters}Порядок {letters_black}» {info}%currency_sort_order%"
      - ""
      - "{secondary}Предпросмотр:"
      - " {letters_black}▎ {letters}Выглядит так {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ ЛКМ, чтобы изменить"
      - "{error}➥ ПКМ, чтобы удалить"
      - ""
    actions:
      - "left: exyliaeconomy:currency_admin_edit %currency_id%"
      - "right: exyliaeconomy:currency_admin_delete %currency_id%"

