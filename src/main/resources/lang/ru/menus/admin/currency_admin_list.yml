        - "next_page"

items:
  create:
    slot: 45
    material: "EMERALD_BLOCK"
    name: "{letters}Валюты {letters_black}▸ <gradient:{success}:{success_light}>Создать валюту</gradient>"
    lore:
      - "{letters_black}Новая валюта"
      - ""
      - "{success}✦ Типы"
      - "  {letters_black}· {highlight}Хранимая{letters_black}: {letters}балансы в базе данных"
      - "  {letters_black}· {highlight}Предмет{letters_black}: {letters}точный предмет у игроков"
      - "  {letters_black}· {highlight}Отображение{letters_black}: {letters}стиль валюты другого плагина"
      - ""
      - "{success}{icon:click} Нажми, чтобы создать"
    actions:
      - "exyliaeconomy:currency_admin_create"

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Плагин {letters_black}▸ <gradient:{primary}:{secondary_light}>Настройки экономики</gradient>"
    lore:
      - "{letters_black}Конфигурация"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Валюты опыта, журнал,"
      - " {letters}Vault, язык и отладка."
