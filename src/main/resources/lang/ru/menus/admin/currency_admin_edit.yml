      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands-item:
    slot: 21
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lКОМАНДЫ"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Первое — сама команда,"
      - " {letters_black}▎ {letters}остальные — её алиасы."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Названия {letters_black}» {info}%currency_aliases%"
      - ""
      - "{warning}➥ Нажми, чтобы изменить"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_aliases %currency_id%"

  item:
    slot: 23
    material: "%currency_item_icon%"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lПРЕДМЕТ"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Считаются только точно такие стаки:"
      - " {letters_black}▎ {letters}с тем же именем, описанием и моделью."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Предмет {letters_black}» %currency_item_state%"
      - ""
      - "{warning}➥ Нажми, чтобы положить новый"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_item %currency_id%"

  pay-confirm-item:
    slot: 24
    material: "PAPER"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lПОДТВЕРЖДЕНИЕ ПЕРЕВОДА"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}/pay свыше суммы требует подтверждения."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Спрашивать свыше {letters_black}» {info}%currency_pay_confirm%"
      - ""
      - "{warning}➥ Нажми, чтобы изменить"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_pay_confirm %currency_id%"

  general-display:
    slot: 21
    material: "NAME_TAG"
    condition: "%currency_kind% == DISPLAY"
    name: "{primary}&lОСНОВНОЕ"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Названия, суммы, иконка и порядок."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Название {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Выглядит так {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Нажми, чтобы открыть"
      - ""
    actions:
