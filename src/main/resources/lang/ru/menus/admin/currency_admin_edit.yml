  pay-confirm-display:
    slot: 23
    material: "PAPER"
    condition: "%currency_kind% == DISPLAY"
    name: "{primary}&lПОДТВЕРЖДЕНИЕ ПЕРЕВОДА"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}/pay свыше суммы требует подтверждения."
      - ""
      - "{secondary}Статус:"
