# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# What one stored currency is worth in the others.

title: "{primary}&lОБМЕН {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  exchangeable:
    slot: 12
    material: "%exchangeable_material%"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Обмен</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Можно ли обменивать её по курсам."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Сейчас{letters_black}: %exchangeable_status%"
      - ""
      - "{primary}» Нажми, чтобы переключить"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% exchangeable"

  rates:
    slot: 14
    material: "SUNFLOWER"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Курсы обмена</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}shards=0.01 значит, что 1 этой"
      - " {letters}стоит 0.01 shards. Работает"
      - " {letters}только при включённом обмене."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:emerald} {letters}Курсы{letters_black}: {info}%currency_rates%"
      - ""
      - "{primary}» Нажми, чтобы изменить"
    actions:
      - "exyliaeconomy:currency_admin_rates %currency_id%"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Валюта</gradient>"
    lore:
      - "{error}» Нажми, чтобы вернуться"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
