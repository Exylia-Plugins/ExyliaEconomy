# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# What one stored currency is worth in the others.

title: "{primary}&lОБМЕН {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  exchangeable:
    slot: 12
    material: "%exchangeable_material%"
    name: "{primary}&lОБМЕН"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Можно ли обменивать её по курсам."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Сейчас {letters_black}» %exchangeable_status%"
      - ""
      - "{warning}➥ Нажми, чтобы переключить"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% exchangeable"

  rates:
    slot: 14
    material: "SUNFLOWER"
    name: "{primary}&lКУРСЫ ОБМЕНА"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}shards=0.01 значит, что 1 этой"
      - " {letters_black}▎ {letters}стоит 0.01 shards. Работает только"
      - " {letters_black}▎ {letters}при включённом обмене."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Курсы {letters_black}» {info}%currency_rates%"
      - ""
      - "{warning}➥ Нажми, чтобы изменить"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_rates %currency_id%"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lНАЗАД"
    lore:
      - ""
      - " {letters_black}▎ {letters}Возврат к обзору валюты."
      - ""
      - "{warning}➥ Нажми, чтобы вернуться"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
