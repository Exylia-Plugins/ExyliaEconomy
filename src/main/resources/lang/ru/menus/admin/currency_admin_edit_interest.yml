# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The interest one stored currency pays its holders.

title: "{primary}&lПРОЦЕНТЫ {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  interest:
    slot: 12
    material: "EXPERIENCE_BOTTLE"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Проценты</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Выплачиваются игрокам"
      - " {letters}с правом на проценты."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:gold} {letters}Ставка{letters_black}: {info}%currency_interest_rate%"
      - "  {letters_black}· {info}{icon:clock} {letters}Каждые{letters_black}: {info}%currency_interest_interval%"
      - "  {letters_black}· {info}{icon:hopper} {letters}Макс. за выплату{letters_black}: {info}%currency_interest_max%"
      - ""
      - "{primary}» Нажми, чтобы изменить"
    actions:
      - "exyliaeconomy:currency_admin_interest %currency_id%"

  interest-offline:
    slot: 14
    material: "%interest_offline_material%"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Проценты офлайн</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Платит и игрокам не в сети,"
      - " {letters}не проверяя их право."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Сейчас{letters_black}: %interest_offline_status%"
      - ""
      - "{primary}» Нажми, чтобы переключить"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% interest_offline"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Валюта</gradient>"
    lore:
      - "{error}» Нажми, чтобы вернуться"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
