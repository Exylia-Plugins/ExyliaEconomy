# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The interest one stored currency pays its holders.

title: "{primary}&lПРОЦЕНТЫ {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  interest:
    slot: 12
    material: "EXPERIENCE_BOTTLE"
    name: "{primary}&lПРОЦЕНТЫ"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Выплачиваются игрокам с правом"
      - " {letters_black}▎ {letters}на проценты."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Ставка {letters_black}» {info}%currency_interest_rate%"
      - " {letters_black}▎ {letters}Каждые {letters_black}» {info}%currency_interest_interval% ⌚"
      - " {letters_black}▎ {letters}Макс. за выплату {letters_black}» {info}%currency_interest_max%"
      - ""
      - "{warning}➥ Нажми, чтобы изменить"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_interest %currency_id%"

  interest-offline:
    slot: 14
    material: "%interest_offline_material%"
    name: "{primary}&lПРОЦЕНТЫ ОФЛАЙН"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Платит и игрокам не в сети,"
      - " {letters_black}▎ {letters}не проверяя их право."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Сейчас {letters_black}» %interest_offline_status%"
      - ""
      - "{warning}➥ Нажми, чтобы переключить"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% interest_offline"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lНАЗАД"
    lore:
      - ""
      - " {letters_black}▎ {letters}Возврат к обзору валюты."
      - ""
      - "{warning}➥ Нажми, чтобы вернуться"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
