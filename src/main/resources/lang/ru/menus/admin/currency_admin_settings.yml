# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The economy's switches that belong to no one currency.

title: "{primary}&lНАСТРОЙКИ ЭКОНОМИКИ"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  experience-levels:
    slot: 11
    material: "%experience_levels_material%"
    name: "{primary}&lУРОВНИ ОПЫТА"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Делает xp_levels валютой,"
      - " {letters_black}▎ {letters}в которой торгуют магазины."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Сейчас {letters_black}» %experience_levels_status%"
      - ""
      - "{warning}➥ Нажми, чтобы переключить"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle experience_levels"

  experience-points:
    slot: 12
    material: "%experience_points_material%"
    name: "{primary}&lОЧКИ ОПЫТА"
    lore:
