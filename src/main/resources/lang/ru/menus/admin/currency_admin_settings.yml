# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The economy's switches that belong to no one currency.

title: "{primary}&lНАСТРОЙКИ ЭКОНОМИКИ"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  experience-levels:
    slot: 11
    material: "%experience_levels_material%"
    name: "{letters}Экономика {letters_black}▸ <gradient:{primary}:{secondary_light}>Уровни опыта</gradient>"
    lore:
      - "{letters_black}Настройка экономики"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Делает xp_levels валютой, в"
      - " {letters}которой торгуют магазины."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Сейчас{letters_black}: %experience_levels_status%"
      - ""
      - "{primary}» Нажми, чтобы переключить"
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle experience_levels"

  experience-points:
