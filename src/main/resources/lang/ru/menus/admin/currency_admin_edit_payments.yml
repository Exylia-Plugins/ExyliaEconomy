# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How one stored currency moves between players.

title: "{primary}&lПЛАТЕЖИ {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  transferable:
    slot: 12
    material: "%transferable_material%"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Переводы</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Могут ли игроки платить друг другу."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Сейчас{letters_black}: %transferable_status%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы переключить"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% transferable"

  pay-confirm:
    slot: 13
    material: "PAPER"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Подтверждение перевода</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}/pay свыше суммы"
      - " {letters}требует подтверждения."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:hopper} {letters}Спрашивать свыше{letters_black}: {info}%currency_pay_confirm%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы изменить"
    actions:
      - "exyliaeconomy:currency_admin_pay_confirm %currency_id%"

  banknotes:
    slot: 14
    material: "%banknotes_material%"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Банкноты</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Может ли /withdraw"
      - " {letters}выпускать банкноты."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Сейчас{letters_black}: %banknotes_status%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы переключить"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% banknotes"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Валюта</gradient>"
    lore:
      - "{error}{icon:click} Нажми, чтобы вернуться"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
