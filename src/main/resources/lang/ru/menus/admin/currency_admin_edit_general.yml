# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The look of one currency: its names, amounts, icon and place in lists.

title: "{primary}&lОСНОВНОЕ {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  icon:
    slot: 11
    material: "%currency_icon%"
    name: "{primary}&lИКОНКА"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Как она выглядит в кошельках и списках."
      - ""
      - "{warning}➥ Нажми, чтобы выбрать"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_icon %currency_id%"

  appearance:
    slot: 13
    material: "NAME_TAG"
    name: "{primary}&lВНЕШНОСТЬ"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Как записывается каждая сумма."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Название {letters_black}» {letters}%currency_name%"
      - " {letters_black}▎ {letters}Мн. число {letters_black}» {letters}%currency_plural%"
      - " {letters_black}▎ {letters}Символ {letters_black}» {letters}%currency_symbol%"
      - " {letters_black}▎ {letters}Знаков после запятой {letters_black}» {info}%currency_decimals%"
      - " {letters_black}▎ {letters}Выглядит так {letters_black}» {letters}%currency_preview%"
      - " {letters_black}▎ {letters}Компактный {letters_black}» {letters}%currency_preview_compact%"
      - ""
      - "{warning}➥ Нажми, чтобы изменить"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_appearance %currency_id%"

  sort-order:
    slot: 15
    material: "HOPPER"
    name: "{primary}&lПОРЯДОК"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Меньшее идёт первым в списках."
      - ""
      - "{secondary}Статус:"
      - " {letters_black}▎ {letters}Сейчас {letters_black}» {info}%currency_sort_order%"
      - ""
      - "{warning}➥ Нажми, чтобы задать"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_sort %currency_id%"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lНАЗАД"
    lore:
      - ""
      - " {letters_black}▎ {letters}Возврат к обзору валюты."
      - ""
      - "{warning}➥ Нажми, чтобы вернуться"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
