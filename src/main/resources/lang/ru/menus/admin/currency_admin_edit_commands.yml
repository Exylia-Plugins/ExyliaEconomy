# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The commands of one stored currency.

title: "{primary}&lКОМАНДЫ {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  aliases:
    slot: 12
    material: "COMMAND_BLOCK"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Названия команды</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Первое — сама команда,"
      - " {letters}остальные — её алиасы."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:tag} {letters}Названия{letters_black}: {info}%currency_aliases%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы изменить"
    actions:
      - "exyliaeconomy:currency_admin_aliases %currency_id%"

  commands:
    slot: 14
    material: "%commands_material%"
    name: "{letters}Валюта {letters_black}▸ <gradient:{primary}:{secondary_light}>Команды включены</gradient>"
    lore:
      - "{letters_black}Настройка валюты"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Существуют ли её команды вообще."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Сейчас{letters_black}: %commands_status%"
      - ""
      - "{primary}{icon:click} Нажми, чтобы переключить"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% commands"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Валюта</gradient>"
    lore:
