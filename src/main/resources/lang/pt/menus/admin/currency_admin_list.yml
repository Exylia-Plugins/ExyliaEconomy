# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every currency the server runs, kept in the database. /economyadmin

title: "{primary}&lMOEDAS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais moedas"
    lore:
      - "{letters_black}Crie uma com o botão abaixo."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primeira página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '0-35'

  item_template:
    material: "%currency_icon%"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>%currency_name%</gradient>"
    lore:
      - "{letters_black}Moeda · %currency_id%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Tipo{letters_black}: {info}%currency_kind%"
      - "  {letters_black}· {info}{icon:iron} {letters}Ordem{letters_black}: {info}%currency_sort_order%"
      - ""
      - "{primary}✦ Prévia"
      - "  {letters_black}· {info}{icon:eye} {letters}Fica assim{letters_black}: {letters}%currency_preview%"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}editar"
      - "{error}{icon:right_click} Clique direito {letters_black}· {letters}excluir"
      - "{letters_black}Você precisará confirmar."
    actions:
      - "left: exyliaeconomy:currency_admin_edit %currency_id%"
      - "right: exyliaeconomy:currency_admin_delete %currency_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  create:
    slot: 45
    material: "EMERALD_BLOCK"
    name: "{letters}Moedas {letters_black}▸ <gradient:{success}:{success_light}>Criar moeda</gradient>"
    lore:
      - "{letters_black}Nova moeda"
      - ""
      - "{success}✦ Tipos"
      - "  {letters_black}· {highlight}Armazenada{letters_black}: {letters}saldos no banco de dados"
      - "  {letters_black}· {highlight}Item{letters_black}: {letters}um item exato que os jogadores carregam"
      - "  {letters_black}· {highlight}Só visual{letters_black}: {letters}reveste a de outro plugin"
      - ""
      - "{success}{icon:click} Clique para criar"
    actions:
      - "exyliaeconomy:currency_admin_create"

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Plugin {letters_black}▸ <gradient:{primary}:{secondary_light}>Config. de economia</gradient>"
    lore:
      - "{letters_black}Configuração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Moedas de experiência, o registro,"
      - " {letters}Vault, idioma e depuração."
      - ""
      - "{primary}{icon:click} Clique para abrir"
    actions:
      - "exyliaeconomy:currency_admin_settings"
