# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One currency. What a button offers depends on its kind: a stored currency
# has rules and switches, an item currency its item, a display-only one only
# its look.

title: "{primary}&lMOEDA {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

  custom:
    frame:
      material: GRAY_STAINED_GLASS_PANE
      hide_tooltip: true
      slots: "0-8,27-35"

items:
  summary:
    slot: 4
    material: "%currency_icon%"
    name: "{primary}&l%currency_plural%"
    lore:
      - ""
      - "{secondary}Moeda:"
      - " {letters_black}▎ {letters}Id {letters_black}» {highlight}%currency_id%"
      - " {letters_black}▎ {letters}Tipo {letters_black}» {info}%currency_kind_label%"
      - ""
      - "{secondary}Prévia:"
      - " {letters_black}▎ {letters}Completa {letters_black}» {letters}%currency_preview%"
      - " {letters_black}▎ {letters}Compacta {letters_black}» {letters}%currency_preview_compact%"
      - ""

  icon:
    slot: 10
    material: "%currency_icon%"
    name: "{primary}&lÍCONE"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Como carteiras e listas a exibem."
      - ""
      - "{warning}➥ Clique para escolher um"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_icon %currency_id%"

  appearance:
    slot: 11
    material: NAME_TAG
    name: "{primary}&lAPARÊNCIA"
    lore:
      - ""
      - "{secondary}Nomes:"
      - " {letters_black}▎ {letters}Nome {letters_black}» {letters}%currency_name%"
      - " {letters_black}▎ {letters}Plural {letters_black}» {letters}%currency_plural%"
      - " {letters_black}▎ {letters}Símbolo {letters_black}» {letters}%currency_symbol%"
      - ""
      - "{secondary}Valores:"
      - " {letters_black}▎ {letters}Decimais {letters_black}» {info}%currency_decimals%"
      - " {letters_black}▎ {letters}Aparência {letters_black}» {letters}%currency_preview%"
      - " {letters_black}▎ {letters}Compacta {letters_black}» {letters}%currency_preview_compact%"
      - ""
      - "{warning}➥ Clique para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_appearance %currency_id%"

  aliases:
    slot: 12
    material: COMMAND_BLOCK
    condition: "%currency_kind% != DISPLAY"
    name: "{primary}&lCOMANDOS"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Nomes {letters_black}» {highlight}%currency_aliases%"
      - " {letters_black}▎ {letters_black}O primeiro é o comando; o resto, aliases."
      - ""
      - "{warning}➥ Clique para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_aliases %currency_id%"

  rules:
    slot: 14
    material: BOOK
    condition: "%currency_kind% == STORED"
    name: "{primary}&lREGRAS"
    lore:
      - ""
      - "{secondary}Saldos:"
      - " {letters_black}▎ {letters}Inicial {letters_black}» {info}%currency_start%"
      - " {letters_black}▎ {letters}Limite {letters_black}» {info}%currency_max%"
      - " {letters_black}▎ {letters}Permissão {letters_black}» {highlight}%currency_permission%"
      - ""
      - "{secondary}Transferências:"
      - " {letters_black}▎ {letters}Mínimo {letters_black}» {info}%currency_minimum_transfer%"
      - " {letters_black}▎ {letters}Taxa {letters_black}» {info}%currency_tax%"
      - ""
      - "{warning}➥ Clique para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_rules %currency_id%"

  item:
    slot: 14
    material: "%currency_item_icon%"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lITEM"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Item {letters_black}» %currency_item_state%"
      - " {letters_black}▎ {letters_black}Só contam pilhas idênticas a ele:"
      - " {letters_black}▎ {letters_black}nome, descrição e modelo incluídos."
      - ""
      - "{warning}➥ Clique para colocar um novo"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_item %currency_id%"

  rates:
    slot: 15
    material: SUNFLOWER
    condition: "%currency_kind% == STORED"
    name: "{primary}&lTAXAS DE CÂMBIO"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Taxas {letters_black}» {info}%currency_rates%"
      - " {letters_black}▎ {letters_black}shards=0.01 significa que 1 desta vale 0.01 shards."
      - " {letters_black}▎ {letters_black}Só é usado com o câmbio ativado."
      - ""
      - "{warning}➥ Clique para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_rates %currency_id%"

  sort-order:
    slot: 16
    material: HOPPER
    name: "{primary}&lORDEM DE EXIBIÇÃO"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Atual {letters_black}» {info}%currency_sort_order%"
      - " {letters_black}▎ {letters_black}Menor aparece primeiro."
      - ""
      - "{warning}➥ Clique para definir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_sort %currency_id%"

  transferable:
    slot: 19
    material: "%transferable_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lTRANSFERÊNCIAS"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Atual {letters_black}» %transferable_status%"
      - " {letters_black}▎ {letters_black}Se os jogadores podem pagar uns aos outros."
      - ""
      - "{warning}➥ Clique para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% transferable"

  exchangeable:
    slot: 20
    material: "%exchangeable_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lCÂMBIO"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Atual {letters_black}» %exchangeable_status%"
      - " {letters_black}▎ {letters_black}Se pode ser trocada pelas suas taxas."
      - ""
      - "{warning}➥ Clique para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% exchangeable"

  leaderboard:
    slot: 21
    material: "%leaderboard_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lRANKING"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Atual {letters_black}» %leaderboard_status%"
      - " {letters_black}▎ {letters_black}Se o top e os placeholders funcionam."
      - ""
      - "{warning}➥ Clique para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% leaderboard"

  networked:
    slot: 23
    material: "%networked_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lCOMPARTILHADA ENTRE SERVIDORES"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Atual {letters_black}» %networked_status%"
      - " {letters_black}▎ {letters_black}Ativado, um saldo em toda a rede;"
      - " {letters_black}▎ {letters_black}desativado, um por servidor. Cada um é"
      - " {letters_black}▎ {letters_black}mantido à parte; voltar o restaura."
      - ""
      - "{warning}➥ Clique para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% networked"

  commands:
    slot: 24
    material: "%commands_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lCOMANDOS ATIVADOS"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Atual {letters_black}» %commands_status%"
      - " {letters_black}▎ {letters_black}Se os nomes de comando existem."
      - ""
      - "{warning}➥ Clique para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% commands"

  vault:
    slot: 25
    material: "%vault_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lECONOMIA DO VAULT"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Atual {letters_black}» %vault_status%"
      - " {letters_black}▎ {letters_black}Publica como a economia Vault do servidor,"
      - " {letters_black}▎ {letters_black}substituindo a moeda que estava antes."
      - ""
      - "{warning}➥ Clique para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% vault"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lVOLTAR'
    lore:
      - ""
      - " {letters_black}▎ {letters}Volta para a lista de moedas"
      - ""
      - "{warning}➥ Clique para voltar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_open_list"

  delete:
    slot: 35
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lEXCLUIR MOEDA"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Remove a moeda. Os saldos salvos"
      - " {letters_black}▎ {letters}ficam no banco de dados, sem uso."
      - " {letters_black}▎ {letters_black}Você precisará confirmar."
      - ""
      - "{error}➥ Clique para excluir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_delete %currency_id%"
