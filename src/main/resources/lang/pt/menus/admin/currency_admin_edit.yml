      - ""
      - "{primary}✎ Informação"
      - " {letters}Seu ranking, o Vault e a rede."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Ranking{letters_black}: %leaderboard_status%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Rede{letters_black}: %networked_status%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Vault{letters_black}: %vault_status%"
