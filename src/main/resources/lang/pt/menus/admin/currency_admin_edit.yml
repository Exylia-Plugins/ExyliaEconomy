      - ""
      - "{primary}✎ Informação"
      - " {letters}O que ela rende a quem a tem."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:gold} {letters}Taxa{letters_black}: {info}%currency_interest_rate%"
      - "  {letters_black}· {info}{icon:clock} {letters}A cada{letters_black}: {info}%currency_interest_interval%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Offline{letters_black}: %interest_offline_status%"
      - ""
      - "{primary}{icon:click} Clique para abrir"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% interest"

  integrations:
    slot: 23
    material: "ENDER_EYE"
    condition: "%currency_kind% == STORED"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Integrações</gradient>"
    lore:
