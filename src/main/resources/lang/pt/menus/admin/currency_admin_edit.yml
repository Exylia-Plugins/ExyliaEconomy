  general-display:
    slot: 21
    material: "NAME_TAG"
    condition: "%currency_kind% == DISPLAY"
    name: "{primary}&lGERAL"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Nomes, quantias, ícone e ordem."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Nome {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Fica assim {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Clique para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  pay-confirm-display:
    slot: 23
    material: "PAPER"
    condition: "%currency_kind% == DISPLAY"
    name: "{primary}&lCONFIRMAÇÃO DE PAGAMENTO"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Um /pay acima disso pede confirmação."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Pergunta acima de {letters_black}» {info}%currency_pay_confirm%"
      - ""
      - "{warning}➥ Clique para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_pay_confirm %currency_id%"

  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lVOLTAR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Volta para a lista de moedas."
      - ""
      - "{warning}➥ Clique para voltar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_open_list"

  delete:
    slot: 44
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0="
    name: "{error}&lEXCLUIR MOEDA"
