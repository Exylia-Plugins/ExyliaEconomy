      - ""
      - "{primary}✎ Informação"
      - " {letters}Nomes, quantias, ícone e ordem."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}Nome{letters_black}: {info}%currency_name%"
      - "  {letters_black}· {info}{icon:eye} {letters}Fica assim{letters_black}: {letters}%currency_preview%"
      - ""
