# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One currency: an overview that opens each section of it. A stored
# currency has every section; an item currency its item, commands and
# pay confirmation; a display-only one its look and pay confirmation.

title: "{primary}&lMOEDA {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  summary:
    slot: 4
    material: "%currency_icon%"
    name: "<gradient:{primary}:{secondary_light}>%currency_plural%</gradient>"
    lore:
      - "{letters_black}Visão geral da moeda"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%currency_id%"
      - "  {letters_black}· {info}{icon:tag} {letters}Tipo{letters_black}: {info}%currency_kind_label%"
      - ""
      - "{primary}✦ Prévia"
      - "  {letters_black}· {info}{icon:eye} {letters}Completa{letters_black}: {letters}%currency_preview%"
      - "  {letters_black}· {info}{icon:eye} {letters}Compacta{letters_black}: {letters}%currency_preview_compact%"

  general:
    slot: 11
    material: "NAME_TAG"
    condition: "%currency_kind% == STORED"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Geral</gradient>"
    lore:
      - "{letters_black}Seção da configuração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Nomes, quantias, ícone e ordem."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}Nome{letters_black}: {info}%currency_name%"
      - ""
      - "{primary}{icon:click} Clique para abrir"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands:
    slot: 12
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == STORED"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Comandos</gradient>"
    lore:
      - "{letters_black}Seção da configuração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}O que os jogadores"
      - " {letters}digitam para usá-la."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}Nomes{letters_black}: {info}%currency_aliases%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Ativados{letters_black}: %commands_status%"
      - ""
      - "{primary}{icon:click} Clique para abrir"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% commands"

  rules:
    slot: 14
    material: "BOOK"
    condition: "%currency_kind% == STORED"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Regras</gradient>"
    lore:
      - "{letters_black}Ajuste da moeda"
      - ""
      - "{primary}♦ Saldos"
      - "  {letters_black}· {info}{icon:gold} {letters}Inicial{letters_black}: {info}%currency_start%"
      - "  {letters_black}· {info}{icon:hopper} {letters}Teto{letters_black}: {info}%currency_max%"
      - "  {letters_black}· {info}{icon:key} {letters}Permissão{letters_black}: {info}%currency_permission%"
      - ""
      - "{primary}♦ Transferências"
      - "  {letters_black}· {info}{icon:hopper} {letters}Mínimo{letters_black}: {info}%currency_minimum_transfer%"
      - "  {letters_black}· {info}{icon:gold} {letters}Taxa{letters_black}: {info}%currency_tax%"
      - ""
      - "{primary}{icon:click} Clique para editar"
    actions:
      - "exyliaeconomy:currency_admin_rules %currency_id%"

  payments:
    slot: 15
    material: "GOLD_NUGGET"
    condition: "%currency_kind% == STORED"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Pagamentos</gradient>"
    lore:
      - "{letters_black}Seção da configuração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Transferências,"
      - " {letters}confirmações e notas."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Transferências{letters_black}: %transferable_status%"
      - "  {letters_black}· {info}{icon:hopper} {letters}Pergunta acima de{letters_black}: {info}%currency_pay_confirm%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Notas{letters_black}: %banknotes_status%"
      - ""
      - "{primary}{icon:click} Clique para abrir"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% payments"

  exchange:
    slot: 21
    material: "SUNFLOWER"
    condition: "%currency_kind% == STORED"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Câmbio</gradient>"
