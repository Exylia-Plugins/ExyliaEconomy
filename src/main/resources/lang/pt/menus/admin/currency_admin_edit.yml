      - ""
      - "{primary}✎ Informação"
      - " {letters}O primeiro é o comando;"
      - " {letters}o resto, seus aliases."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}Nomes{letters_black}: {info}%currency_aliases%"
      - ""
      - "{primary}{icon:click} Clique para editar"
    actions:
      - "exyliaeconomy:currency_admin_aliases %currency_id%"

  item:
    slot: 14
    material: "%currency_item_icon%"
    condition: "%currency_kind% == ITEM"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Item</gradient>"
    lore:
      - "{letters_black}Ajuste da moeda"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Só contam stacks idênticos:"
      - " {letters}nome, lore e modelo incluídos."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:check} {letters}Item{letters_black}: %currency_item_state%"
      - ""
      - "{primary}{icon:click} Clique para colocar um novo"
    actions:
      - "exyliaeconomy:currency_admin_item %currency_id%"

  pay-confirm-item:
