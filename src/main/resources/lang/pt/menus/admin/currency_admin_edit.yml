      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Câmbio{letters_black}: %exchangeable_status%"
      - "  {letters_black}· {info}{icon:emerald} {letters}Taxas{letters_black}: {info}%currency_rates%"
      - ""
      - "{primary}{icon:click} Clique para abrir"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% exchange"

  interest:
    slot: 22
    material: "EXPERIENCE_BOTTLE"
    condition: "%currency_kind% == STORED"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Juros</gradient>"
