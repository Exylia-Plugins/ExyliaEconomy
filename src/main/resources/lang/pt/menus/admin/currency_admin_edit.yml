# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One currency: an overview that opens each section of it. A stored
# currency has every section; an item currency its item, commands and
# pay confirmation; a display-only one its look and pay confirmation.

title: "{primary}&lMOEDA {letters_black}» {highlight}%currency_id%"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  summary:
    slot: 4
    material: "%currency_icon%"
    name: "{primary}&l%currency_plural%"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}ID {letters_black}» {info}%currency_id%"
      - " {letters_black}▎ {letters}Tipo {letters_black}» {info}%currency_kind_label%"
      - ""
      - "{secondary}Prévia:"
      - " {letters_black}▎ {letters}Completa {letters_black}» {letters}%currency_preview%"
      - " {letters_black}▎ {letters}Compacta {letters_black}» {letters}%currency_preview_compact%"
      - ""

  general:
    slot: 19
    material: "NAME_TAG"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lGERAL"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Nomes, quantias, ícone e ordem."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Nome {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Fica assim {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Clique para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands:
    slot: 20
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lCOMANDOS"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}O que os jogadores digitam para usá-la."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Nomes {letters_black}» {info}%currency_aliases%"
      - " {letters_black}▎ {letters}Ativados {letters_black}» %commands_status%"
      - ""
      - "{warning}➥ Clique para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% commands"

  rules:
    slot: 21
    material: "BOOK"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lREGRAS"
    lore:
      - ""
      - "{secondary}Saldos:"
      - " {letters_black}▎ {letters}Inicial {letters_black}» {info}%currency_start%"
      - " {letters_black}▎ {letters}Teto {letters_black}» {info}%currency_max%"
      - " {letters_black}▎ {letters}Permissão {letters_black}» {info}%currency_permission%"
      - ""
      - "{secondary}Transferências:"
      - " {letters_black}▎ {letters}Mínimo {letters_black}» {info}%currency_minimum_transfer%"
      - " {letters_black}▎ {letters}Taxa {letters_black}» {info}%currency_tax%"
      - ""
      - "{warning}➥ Clique para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_rules %currency_id%"

  payments:
    slot: 22
    material: "GOLD_NUGGET"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lPAGAMENTOS"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Transferências, confirmações e notas."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Transferências {letters_black}» %transferable_status%"
      - " {letters_black}▎ {letters}Pergunta acima de {letters_black}» {info}%currency_pay_confirm%"
      - " {letters_black}▎ {letters}Notas {letters_black}» %banknotes_status%"
      - ""
      - "{warning}➥ Clique para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% payments"

  exchange:
    slot: 23
    material: "SUNFLOWER"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lCÂMBIO"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Trocá-la por outras moedas."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Câmbio {letters_black}» %exchangeable_status%"
      - " {letters_black}▎ {letters}Taxas {letters_black}» {info}%currency_rates%"
      - ""
      - "{warning}➥ Clique para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% exchange"

  interest:
    slot: 24
    material: "EXPERIENCE_BOTTLE"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lJUROS"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}O que ela rende a quem a tem."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Taxa {letters_black}» {info}%currency_interest_rate%"
      - " {letters_black}▎ {letters}A cada {letters_black}» {info}%currency_interest_interval% ⌚"
      - " {letters_black}▎ {letters}Offline {letters_black}» %interest_offline_status%"
      - ""
      - "{warning}➥ Clique para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% interest"

  integrations:
    slot: 25
    material: "ENDER_EYE"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lINTEGRAÇÕES"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Seu ranking, o Vault e a rede."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Ranking {letters_black}» %leaderboard_status%"
      - " {letters_black}▎ {letters}Rede {letters_black}» %networked_status%"
      - " {letters_black}▎ {letters}Vault {letters_black}» %vault_status%"
      - ""
      - "{warning}➥ Clique para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% integrations"

  general-item:
    slot: 20
    material: "NAME_TAG"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lGERAL"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Nomes, quantias, ícone e ordem."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Nome {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Fica assim {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Clique para abrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands-item:
    slot: 21
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lCOMANDOS"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}O primeiro é o comando;"
      - " {letters_black}▎ {letters}o resto, seus aliases."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Nomes {letters_black}» {info}%currency_aliases%"
      - ""
      - "{warning}➥ Clique para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_aliases %currency_id%"

  item:
    slot: 23
    material: "%currency_item_icon%"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lITEM"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Só contam stacks idênticos:"
      - " {letters_black}▎ {letters}nome, lore e modelo incluídos."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Item {letters_black}» %currency_item_state%"
      - ""
      - "{warning}➥ Clique para colocar um novo"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_item %currency_id%"

  pay-confirm-item:
    slot: 24
    material: "PAPER"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lCONFIRMAÇÃO DE PAGAMENTO"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Um /pay acima disso pede confirmação."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Pergunta acima de {letters_black}» {info}%currency_pay_confirm%"
      - ""
      - "{warning}➥ Clique para editar"
      - ""
