# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The look of one currency: its names, amounts, icon and place in lists.

title: "{primary}&lGERAL {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  icon:
    slot: 12
    material: "%currency_icon%"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Ícone</gradient>"
    lore:
      - "{letters_black}Ajuste da moeda"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Como carteiras e listas a mostram."
      - ""
      - "{primary}{icon:click} Clique para escolher um"
    actions:
      - "exyliaeconomy:currency_admin_icon %currency_id%"

  appearance:
    slot: 13
    material: "NAME_TAG"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Aparência</gradient>"
    lore:
      - "{letters_black}Ajuste da moeda"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Como cada quantia é escrita."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:tag} {letters}Nome{letters_black}: {letters}%currency_name%"
      - "  {letters_black}· {info}{icon:tag} {letters}Plural{letters_black}: {letters}%currency_plural%"
      - "  {letters_black}· {info}{icon:tag} {letters}Símbolo{letters_black}: {letters}%currency_symbol%"
      - "  {letters_black}· {info}{icon:iron} {letters}Decimais{letters_black}: {info}%currency_decimals%"
      - "  {letters_black}· {info}{icon:eye} {letters}Fica assim{letters_black}: {letters}%currency_preview%"
      - "  {letters_black}· {info}{icon:eye} {letters}Compacta{letters_black}: {letters}%currency_preview_compact%"
      - ""
      - "{primary}{icon:click} Clique para editar"
    actions:
      - "exyliaeconomy:currency_admin_appearance %currency_id%"

  sort-order:
    slot: 14
    material: "HOPPER"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Ordem</gradient>"
    lore:
      - "{letters_black}Ajuste da moeda"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Menor aparece primeiro nas listas."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:iron} {letters}Atual{letters_black}: {info}%currency_sort_order%"
      - ""
      - "{primary}{icon:click} Clique para definir"
    actions:
      - "exyliaeconomy:currency_admin_sort %currency_id%"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>Moeda</gradient>"
    lore:
      - "{error}{icon:click} Clique para voltar"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
