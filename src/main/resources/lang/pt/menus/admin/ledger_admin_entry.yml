# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One ledger line, with the button that rolls it back.
#
# Values: %ledger_owner% %currency% %entry_id% %entry_icon% %entry_delta% %entry_balance%
# %entry_reason% %entry_initiator% %entry_server% %entry_when%

title: "{primary}&lENTRADA {letters_black}» {highlight}#%entry_id%"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%entry_icon%"
    name: "{primary}&lENTRADA #%entry_id% &8[%entry_delta%&8]"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Jogador {letters_black}» {highlight}%ledger_owner%"
      - " {letters_black}▎ {letters}Moeda {letters_black}» {highlight}%currency%"
      - ""

  amount:
    slot: 11
    material: GOLD_NUGGET
    name: "{primary}&lQUANTIA"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Movido {letters_black}» %entry_delta%"
      - " {letters_black}▎ {letters}Saldo depois {letters_black}» {info}%entry_balance%"
      - ""

  when:
    slot: 13
    material: CLOCK
    name: "{primary}&lDATA"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Registrado {letters_black}» {info}%entry_when% ⌚"
      - " {letters_black}▎ {letters}Servidor {letters_black}» {info}%entry_server%"
      - ""

  source:
    slot: 15
    material: NAME_TAG
    name: "{primary}&lORIGEM"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Motivo {letters_black}» {highlight}%entry_reason%"
      - " {letters_black}▎ {letters}Causado por {letters_black}» {highlight}%entry_initiator%"
      - ""

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lVOLTAR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Volta ao registro."
      - ""
      - "{warning}➥ Clique para voltar"
      - ""
    actions:
      - "exyliaeconomy:ledger_admin_list %ledger_owner% %currency_id%"

  rollback:
    slot: 26
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0="
    name: "{error}&lREVERTER"
