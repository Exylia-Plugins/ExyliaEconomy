# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How one stored currency moves between players.

title: "{primary}&lPAGAMENTOS {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  transferable:
    slot: 11
    material: "%transferable_material%"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Transferências</gradient>"
    lore:
      - "{letters_black}Ajuste da moeda"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Se os jogadores podem"
      - " {letters}pagar uns aos outros."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Atual{letters_black}: %transferable_status%"
      - ""
      - "{primary}» Clique para alternar"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% transferable"

  pay-confirm:
    slot: 13
    material: "PAPER"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Confirmação de pagamento</gradient>"
    lore:
      - "{letters_black}Ajuste da moeda"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Um /pay acima disso"
      - " {letters}pede confirmação."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:hopper} {letters}Pergunta acima de{letters_black}: {info}%currency_pay_confirm%"
      - ""
      - "{primary}» Clique para editar"
    actions:
      - "exyliaeconomy:currency_admin_pay_confirm %currency_id%"

  banknotes:
    slot: 15
    material: "%banknotes_material%"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Notas</gradient>"
    lore:
      - "{letters_black}Ajuste da moeda"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Se /withdraw pode"
      - " {letters}emiti-la como nota."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Atual{letters_black}: %banknotes_status%"
      - ""
      - "{primary}» Clique para alternar"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% banknotes"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>Moeda</gradient>"
    lore:
      - "{error}» Clique para voltar"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
