# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How one stored currency moves between players.

title: "{primary}&lPAGAMENTOS {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  transferable:
    slot: 11
    material: "%transferable_material%"
    name: "{primary}&lTRANSFERÊNCIAS"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Se os jogadores podem pagar uns aos outros."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Atual {letters_black}» %transferable_status%"
      - ""
      - "{warning}➥ Clique para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% transferable"

  pay-confirm:
    slot: 13
    material: "PAPER"
    name: "{primary}&lCONFIRMAÇÃO DE PAGAMENTO"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Um /pay acima disso pede confirmação."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Pergunta acima de {letters_black}» {info}%currency_pay_confirm%"
      - ""
      - "{warning}➥ Clique para editar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_pay_confirm %currency_id%"

  banknotes:
    slot: 15
    material: "%banknotes_material%"
    name: "{primary}&lNOTAS"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Se /withdraw pode emiti-la como nota."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Atual {letters_black}» %banknotes_status%"
      - ""
      - "{warning}➥ Clique para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% banknotes"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lVOLTAR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Volta para o resumo da moeda."
      - ""
      - "{warning}➥ Clique para voltar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
