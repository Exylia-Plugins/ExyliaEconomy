# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The interest one stored currency pays its holders.

title: "{primary}&lJUROS {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  interest:
    slot: 12
    material: "EXPERIENCE_BOTTLE"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Juros</gradient>"
    lore:
      - "{letters_black}Ajuste da moeda"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Pago aos jogadores com"
      - " {letters}a permissão de juros."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:gold} {letters}Taxa{letters_black}: {info}%currency_interest_rate%"
      - "  {letters_black}· {info}{icon:clock} {letters}A cada{letters_black}: {info}%currency_interest_interval%"
      - "  {letters_black}· {info}{icon:hopper} {letters}Máximo por pagamento{letters_black}: {info}%currency_interest_max%"
      - ""
      - "{primary}» Clique para editar"
    actions:
      - "exyliaeconomy:currency_admin_interest %currency_id%"

  interest-offline:
    slot: 14
    material: "%interest_offline_material%"
    name: "{letters}Moeda {letters_black}▸ <gradient:{primary}:{secondary_light}>Juros offline</gradient>"
    lore:
      - "{letters_black}Ajuste da moeda"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Também paga quem não está online,"
      - " {letters}sem verificar a permissão."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Atual{letters_black}: %interest_offline_status%"
      - ""
      - "{primary}» Clique para alternar"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% interest_offline"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>Moeda</gradient>"
    lore:
      - "{error}» Clique para voltar"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
