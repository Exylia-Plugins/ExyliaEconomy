# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One player's ledger in one currency, newest first. /economyadmin log <player> [currency]
#
# Values: %ledger_owner% %currency% %currency_icon% %ledger_size%
# Each line: %entry_id% %entry_icon% %entry_delta% %entry_balance% %entry_reason% %entry_when%

title: "{primary}&lREGISTRO {letters_black}» {highlight}%ledger_owner% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais movimentos"
    lore:
      - "{letters_black}Só moedas armazenadas com o"
      - "{letters_black}registro ativo guardam movimentos."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primeira página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '0-35'

  item_template:
    material: "%entry_icon%"
    name: "{letters}Registro {letters_black}▸ <gradient:{info}:{info_light}>Entrada #%entry_id%</gradient> &8[%entry_delta%&8]"
    lore:
      - "{letters_black}Entrada do registro"
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {highlight}{icon:coin} {letters}Moeda{letters_black}: {highlight}%currency%"
      - "  {letters_black}· {highlight}{icon:book} {letters}Motivo{letters_black}: {highlight}%entry_reason%"
      - "  {letters_black}· {info}{icon:clock} {letters}Quando{letters_black}: {info}%entry_when%"
      - "  {letters_black}· {info}{icon:gold} {letters}Saldo depois{letters_black}: {info}%entry_balance%"
      - ""
      - "{info}{icon:click} Clique para abrir"
    actions:
      - "exyliaeconomy:ledger_admin_entry %entry_id% %currency_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  currency:
    slot: 49
    material: "%currency_icon%"
    name: "<gradient:{info}:{info_light}>%currency%</gradient>"
    lore:
      - "{letters_black}Registro do jogador"
      - ""
      - "{info}✎ Informação"
      - " {letters}Últimos movimentos de"
      - " {highlight}%ledger_owner%{letters}."
      - " {letters}Outra moeda{letters_black}:"
      - " {highlight}/eadmin log"
      - " {highlight}%ledger_owner% <moeda>"
      - ""
      - "{info}✦ Estado"
