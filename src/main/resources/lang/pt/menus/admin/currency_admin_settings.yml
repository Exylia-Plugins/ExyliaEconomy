# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The economy's switches that belong to no one currency.

title: "{primary}&lCONFIG. DE ECONOMIA"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  experience-levels:
    slot: 11
    material: "%experience_levels_material%"
    name: "{primary}&lNÍVEIS DE EXPERIÊNCIA"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Faz de xp_levels uma moeda"
      - " {letters_black}▎ {letters}que as lojas podem cobrar."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Atual {letters_black}» %experience_levels_status%"
      - ""
      - "{warning}➥ Clique para alternar"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle experience_levels"

  experience-points:
    slot: 12
    material: "%experience_points_material%"
    name: "{primary}&lPONTOS DE EXPERIÊNCIA"
    lore:
