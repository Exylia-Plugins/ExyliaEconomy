# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The economy's switches that belong to no one currency.

title: "{primary}&lCONFIG. DE ECONOMIA"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  experience-levels:
    slot: 11
    material: "%experience_levels_material%"
    name: "{letters}Economia {letters_black}▸ <gradient:{primary}:{secondary_light}>Níveis de experiência</gradient>"
    lore:
      - "{letters_black}Ajuste da economia"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Faz de xp_levels uma moeda"
      - " {letters}que as lojas podem cobrar."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Atual{letters_black}: %experience_levels_status%"
      - ""
      - "{primary}{icon:click} Clique para alternar"
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle experience_levels"

  experience-points:
    slot: 12
    material: "%experience_points_material%"
    name: "{letters}Economia {letters_black}▸ <gradient:{primary}:{secondary_light}>Pontos de experiência</gradient>"
