# The leaderboard of one currency. /baltop
#
# Yours to restyle: edits are kept across updates. A release that has to
# change the layout raises menu-version below; the file is then replaced
# and your previous one is kept next to it.
#
# Values: %currency% %currency_icon% %top_size% %top_total%
# Each place: %top_position% %top_player% %top_amount%

menu-version: 2

title: "{primary}&lRANKING {letters_black}» {highlight}%currency% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais jogadores"
    lore:
      - "{letters_black}Quem tiver alguma aparece aqui."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "playerhead-%top_player%"
    name: "{letters}Top {letters_black}▸ <gradient:{highlight}:{warning_light}>%top_player%</gradient> &8[{highlight}#%top_position%&8]"
    lore:
      - "{letters_black}Ranking"
      - ""
      - "{highlight}✦ Estado"
      - "  {letters_black}· {success}{icon:gold} {letters}Saldo{letters_black}: {success}%top_amount%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  total:
    slot: 45
    material: "%currency_icon%"
    name: "<gradient:{info}:{info_light}>Em circulação</gradient>"
    lore:
      - "{letters_black}Ranking"
      - ""
      - "{info}✎ Informação"
      - " {letters}Todos os saldos, ocultos incluídos."
      - ""
      - "{info}✦ Estado"
      - "  {letters_black}· {info}{icon:gold} {letters}Total{letters_black}: {info}%top_total%"
      - "  {letters_black}· {info}{icon:iron} {letters}No ranking{letters_black}: {info}%top_size%"

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>Carteira</gradient>"
    lore:
      - "{error}» Clique para voltar"
    actions:
      - "exyliaeconomy:economy_wallet"
