# The wallet: every currency somebody holds. /wallet
#
# Yours to restyle: edits are kept across updates. A release that has to
# change the layout raises menu-version below; the file is then replaced
# and your previous one is kept next to it.
#
# Values: %wallet_owner% %wallet_currencies%
# Each currency: %currency% %currency_icon% %currency_balance% %currency_kind%

menu-version: 2

title: "{primary}&lWALLET {letters_black}» {highlight}%wallet_owner% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more currencies"
    lore:
      - "{letters_black}Currencies you can hold appear here."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%currency_icon%"
    name: "{letters}Wallet {letters_black}▸ <gradient:{info}:{info_light}>%currency%</gradient>"
    lore:
      - "{letters_black}Currency"
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Kind{letters_black}: {info}%currency_kind%"
      - "  {letters_black}· {success}{icon:gold} {letters}Balance{letters_black}: {success}%currency_balance%"
      - ""
      - "{info}» Left-click {letters_black}· {letters}history"
      - "{info}» Right-click {letters_black}· {letters}leaderboard"
    actions:
      - "left: exyliaeconomy:economy_history %currency_id% %wallet_owner_id%"
      - "right: exyliaeconomy:economy_top %currency_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Previous</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Next →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  owner:
    slot: 49
    material: "playerhead-%wallet_owner%"
    name: "<gradient:{info}:{info_light}>%wallet_owner%</gradient>"
    lore:
      - "{letters_black}Wallet"
      - ""
      - "{info}✎ Information"
      - " {letters}Everything this wallet"
      - " {letters}holds, on this server"
      - " {letters}and across the network."
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Currencies{letters_black}: {info}%wallet_currencies%"
