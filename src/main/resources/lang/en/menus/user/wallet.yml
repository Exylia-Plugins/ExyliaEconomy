# The wallet: every currency somebody holds.
#
# Written once, when it is missing, and never overwritten.
#
# Values: %wallet_owner% %wallet_currencies%
# Each currency: %currency% %currency_icon% %currency_balance% %currency_kind%

title: "{primary}&lWALLET {letters_black}» {highlight}%wallet_owner%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{letters_black}&lNO CURRENCIES"
    lore:
      - ""
      - " {letters_black}▎ {letters}This server runs no currency"
      - " {letters_black}▎ {letters}you are allowed to hold."
      - ""
    hide_tooltip: false

pagination:
  slots: '10-16,19-25,28-34'

  item_template:
    material: "%currency_icon%"
    name: "{primary}&l%currency%"
    lore:
      - ""
      - "{secondary}Currency:"
      - " {letters_black}▎ {letters}Balance {letters_black}» {success}%currency_balance%"
      - " {letters_black}▎ {letters}Kind {letters_black}» {info}%currency_kind%"
      - ""
      - "{warning}➥ Left click for the history"
      - "{warning}➥ Right click for the leaderboard"
      - ""
    actions:
      - "left: exyliaeconomy:economy_history %currency_id% %wallet_owner_id%"
      - "right: exyliaeconomy:economy_top %currency_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  owner:
    slot: 4
    material: 'playerhead-%wallet_owner%'
    name: "{primary}&l%wallet_owner%"
    lore:
      - ""
      - "{secondary}Wallet:"
      - " {letters_black}▎ {letters}Currencies {letters_black}» {info}%wallet_currencies%"
      - ""
      - " {letters_black}▎ {letters_black}Everything this wallet holds,"
      - " {letters_black}▎ {letters_black}on this server and the network."
      - ""

