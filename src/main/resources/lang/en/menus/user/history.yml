# Where somebody's money went, in one currency.
#
# Yours to restyle: edits are kept across updates. A release that has to
# change the layout raises menu-version below; the file is then replaced
# and your previous one is kept next to it.
#
# Values: %currency% %currency_icon% %history_owner% %history_size%
# Each movement: %entry_icon% %entry_when% %entry_delta% %entry_reason% %entry_balance% %entry_server%

menu-version: 1

title: "{primary}&lHISTORY {letters_black}» {highlight}%history_owner% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more movements"
    lore:
      - ""
      - " {letters_black}▎ {letters}Only currencies this server stores"
      - " {letters_black}▎ {letters}keep a history."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%entry_icon%"
    name: "%entry_delta%"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Reason {letters_black}» {highlight}%entry_reason%"
      - " {letters_black}▎ {letters}When {letters_black}» {info}%entry_when% ⌚"
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Balance after {letters_black}» {info}%entry_balance%"
      - ""

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← PREVIOUS PAGE"
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lNEXT PAGE →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  currency:
    slot: 45
    material: "%currency_icon%"
    name: "{primary}&l%currency%"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Newest movements first."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Movements {letters_black}» {info}%history_size%"
      - ""

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lBACK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Returns to the wallet."
      - ""
      - "{warning}➥ Click to go back"
      - ""
    actions:
      - "exyliaeconomy:economy_wallet %history_owner_id%"
