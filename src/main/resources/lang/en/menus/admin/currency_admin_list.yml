# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every currency the server runs, kept in the database. /economyadmin

title: "{primary}&lCURRENCIES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more currencies"
    lore:
      - "{letters_black}Create one with the button below."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%currency_icon%"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>%currency_name%</gradient>"
    lore:
      - "{letters_black}Currency · %currency_id%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Kind{letters_black}: {info}%currency_kind%"
      - "  {letters_black}· {info}{icon:iron} {letters}Sort order{letters_black}: {info}%currency_sort_order%"
      - ""
      - "{primary}✦ Preview"
      - "  {letters_black}· {info}{icon:eye} {letters}Looks like{letters_black}: {letters}%currency_preview%"
      - ""
      - "{primary}» Left-click {letters_black}· {letters}edit"
      - "{error}» Right-click {letters_black}· {letters}delete"
      - "{letters_black}You will be asked to confirm."
    actions:
      - "left: exyliaeconomy:currency_admin_edit %currency_id%"
      - "right: exyliaeconomy:currency_admin_delete %currency_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Previous</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Next →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  create:
    slot: 45
    material: "EMERALD_BLOCK"
    name: "{letters}Currencies {letters_black}▸ <gradient:{success}:{success_light}>Create currency</gradient>"
    lore:
      - "{letters_black}New currency"
      - ""
      - "{success}✦ Kinds"
      - "  {letters_black}· {highlight}Stored{letters_black}: {letters}balances in the database"
      - "  {letters_black}· {highlight}Item{letters_black}: {letters}an exact item players carry"
      - "  {letters_black}· {highlight}Display only{letters_black}: {letters}restyles another plugin's"
      - ""
      - "{success}» Click to create"
    actions:
      - "exyliaeconomy:currency_admin_create"

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Plugin {letters_black}▸ <gradient:{primary}:{secondary_light}>Economy settings</gradient>"
    lore:
      - "{letters_black}Configuration"
      - ""
      - "{primary}✎ Information"
      - " {letters}Experience currencies, the ledger,"
      - " {letters}Vault, language and debug."
      - ""
      - "{primary}» Click to open"
    actions:
      - "exyliaeconomy:currency_admin_settings"
