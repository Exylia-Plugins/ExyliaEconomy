# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every currency the server runs, kept in the database. /economyadmin

title: "{primary}&lCURRENCIES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

  custom:
    frame:
      material: GRAY_STAINED_GLASS_PANE
      hide_tooltip: true
      slots: "45-53"

  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{letters_black}&lNO CURRENCIES YET"
    lore:
      - ""
      - " {letters_black}▎ {letters}Create one with the button below."
      - ""

pagination:
  slots: '0-35'

  item_template:
    material: "%currency_icon%"
    name: "{primary}&l%currency_name% {letters_black}%currency_id%"
    lore:
      - ""
      - "{secondary}Currency:"
      - " {letters_black}▎ {letters}Kind {letters_black}» {info}%currency_kind%"
      - " {letters_black}▎ {letters}Looks like {letters_black}» {letters}%currency_preview%"
      - " {letters_black}▎ {letters}Sort order {letters_black}» {info}%currency_sort_order%"
      - ""
      - "{warning}➥ Left-click to edit"
      - "{warning}➥ Right-click to delete"
      - ""
    actions:
      - "left: exyliaeconomy:currency_admin_edit %currency_id%"
      - "right: exyliaeconomy:currency_admin_delete %currency_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: '{error}&l← PREVIOUS PAGE'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: '{success}&lNEXT PAGE →'
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""

items:
  create:
    slot: 45
    material: EMERALD
    name: "{success}&lCREATE CURRENCY"
    lore:
      - ""
      - "{secondary}Kinds:"
      - " {letters_black}▎ {info}Stored {letters_black}» {letters}balances kept in the database"
      - " {letters_black}▎ {info}Item {letters_black}» {letters}an exact item players carry"
      - " {letters_black}▎ {info}Display only {letters_black}» {letters}restyles another plugin's"
      - ""
      - "{warning}➥ Click to create"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_create"

  settings:
    slot: 53
    material: COMPARATOR
    name: "{primary}&lECONOMY SETTINGS"
    lore:
      - ""
      - " {letters_black}▎ {letters}Experience currencies, the ledger"
      - " {letters_black}▎ {letters}and the Vault economy."
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings"
