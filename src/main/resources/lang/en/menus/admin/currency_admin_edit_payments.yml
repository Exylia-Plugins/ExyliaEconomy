# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How one stored currency moves between players.

title: "{primary}&lPAYMENTS {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  transferable:
    slot: 11
    material: "%transferable_material%"
    name: "{primary}&lTRANSFERS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Whether players can pay each other."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %transferable_status%"
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% transferable"

  pay-confirm:
    slot: 13
    material: "PAPER"
    name: "{primary}&lPAY CONFIRMATION"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}A /pay above it asks the payer first."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Asks above {letters_black}» {info}%currency_pay_confirm%"
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_pay_confirm %currency_id%"

  banknotes:
    slot: 15
    material: "%banknotes_material%"
    name: "{primary}&lBANKNOTES"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Whether /withdraw may print it as a note."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %banknotes_status%"
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% banknotes"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lBACK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Returns to the currency overview."
      - ""
      - "{warning}➥ Click to go back"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
