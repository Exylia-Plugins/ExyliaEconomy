# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# What one stored currency is worth in the others.

title: "{primary}&lEXCHANGE {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  exchangeable:
    slot: 12
    material: "%exchangeable_material%"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Exchange</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Whether it can be"
      - " {letters}swapped at its rates."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Current{letters_black}: %exchangeable_status%"
      - ""
      - "{primary}» Click to toggle"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% exchangeable"

  rates:
    slot: 14
    material: "SUNFLOWER"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Exchange rates</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}shards=0.01 means 1 of this"
      - " {letters}is worth 0.01 shards. Only"
      - " {letters}used while exchange is on."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:emerald} {letters}Rates{letters_black}: {info}%currency_rates%"
      - ""
      - "{primary}» Click to edit"
    actions:
      - "exyliaeconomy:currency_admin_rates %currency_id%"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Currency</gradient>"
    lore:
      - "{error}» Click to go back"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
