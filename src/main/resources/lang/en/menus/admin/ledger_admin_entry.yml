# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One ledger line, with the button that rolls it back.
#
# Values: %ledger_owner% %currency% %entry_id% %entry_icon% %entry_delta% %entry_balance%
# %entry_reason% %entry_initiator% %entry_server% %entry_when%

title: "{primary}&lENTRY {letters_black}» {highlight}#%entry_id%"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: "%entry_icon%"
    name: "{primary}&lENTRY #%entry_id% &8[%entry_delta%&8]"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Player {letters_black}» {highlight}%ledger_owner%"
      - " {letters_black}▎ {letters}Currency {letters_black}» {highlight}%currency%"
      - ""

  amount:
    slot: 11
    material: GOLD_NUGGET
    name: "{primary}&lAMOUNT"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Moved {letters_black}» %entry_delta%"
      - " {letters_black}▎ {letters}Balance after {letters_black}» {info}%entry_balance%"
      - ""

  when:
    slot: 13
    material: CLOCK
    name: "{primary}&lWHEN"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Written {letters_black}» {info}%entry_when% ⌚"
      - " {letters_black}▎ {letters}Server {letters_black}» {info}%entry_server%"
      - ""

  source:
    slot: 15
    material: NAME_TAG
    name: "{primary}&lSOURCE"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Reason {letters_black}» {highlight}%entry_reason%"
      - " {letters_black}▎ {letters}Caused by {letters_black}» {highlight}%entry_initiator%"
      - ""

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lBACK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Returns to the ledger."
      - ""
      - "{warning}➥ Click to go back"
      - ""
    actions:
      - "exyliaeconomy:ledger_admin_list %ledger_owner% %currency_id%"

  rollback:
    slot: 26
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0="
    name: "{error}&lROLL BACK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Reverses this movement once."
      - " {letters_black}▎ {letters}Payments, exchanges and banknotes"
      - " {letters_black}▎ {letters}are never reverted."
      - ""
      - "{error}➥ Click to roll back"
      - "{letters_black}You will be asked to confirm."
      - ""
    actions:
      - "exyliaeconomy:ledger_admin_rollback %ledger_owner% %entry_id% %currency_id%"
