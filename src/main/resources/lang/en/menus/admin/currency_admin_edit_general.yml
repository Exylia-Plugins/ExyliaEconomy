# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The look of one currency: its names, amounts, icon and place in lists.

title: "{primary}&lGENERAL {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  icon:
    slot: 11
    material: "%currency_icon%"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Icon</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}What wallets and lists draw it as."
      - ""
      - "{primary}» Click to choose one"
    actions:
      - "exyliaeconomy:currency_admin_icon %currency_id%"

  appearance:
    slot: 13
    material: "NAME_TAG"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Appearance</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How every amount of it is written."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Name{letters_black}: {letters}%currency_name%"
      - "  {letters_black}· {info}{icon:tag} {letters}Plural{letters_black}: {letters}%currency_plural%"
      - "  {letters_black}· {info}{icon:tag} {letters}Symbol{letters_black}: {letters}%currency_symbol%"
      - "  {letters_black}· {info}{icon:iron} {letters}Decimals{letters_black}: {info}%currency_decimals%"
      - "  {letters_black}· {info}{icon:eye} {letters}Looks like{letters_black}: {letters}%currency_preview%"
      - "  {letters_black}· {info}{icon:eye} {letters}Compact{letters_black}: {letters}%currency_preview_compact%"
      - ""
      - "{primary}» Click to edit"
    actions:
      - "exyliaeconomy:currency_admin_appearance %currency_id%"

  sort-order:
    slot: 15
    material: "HOPPER"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Sort order</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Lower is shown first in lists."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Current{letters_black}: {info}%currency_sort_order%"
      - ""
      - "{primary}» Click to set it"
    actions:
      - "exyliaeconomy:currency_admin_sort %currency_id%"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Currency</gradient>"
    lore:
      - "{error}» Click to go back"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
