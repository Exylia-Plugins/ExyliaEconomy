# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One player's ledger in one currency, newest first. /economyadmin log <player> [currency]
#
# Values: %ledger_owner% %currency% %currency_icon% %ledger_size%
# Each line: %entry_id% %entry_icon% %entry_delta% %entry_balance% %entry_reason% %entry_when%

title: "{primary}&lLEDGER {letters_black}» {highlight}%ledger_owner% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more movements"
    lore:
      - ""
      - " {letters_black}▎ {letters}Only stored currencies with the"
      - " {letters_black}▎ {letters}ledger on keep their movements."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%entry_icon%"
    name: "{primary}&lENTRY #%entry_id% &8[%entry_delta%&8]"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Amount {letters_black}» %entry_delta%"
      - " {letters_black}▎ {letters}Currency {letters_black}» {highlight}%currency%"
      - " {letters_black}▎ {letters}Reason {letters_black}» {highlight}%entry_reason%"
      - " {letters_black}▎ {letters}When {letters_black}» {info}%entry_when% ⌚"
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Balance after {letters_black}» {info}%entry_balance%"
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliaeconomy:ledger_admin_entry %entry_id% %currency_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← PREVIOUS PAGE"
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
