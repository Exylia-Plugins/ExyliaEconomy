      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  currency:
    slot: 49
    material: "%currency_icon%"
    name: "{primary}&l%currency%"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Newest movements of {highlight}%ledger_owner%{letters}."
      - " {letters_black}▎ {letters}Another currency{letters_black}: {highlight}/eadmin log"
      - " {letters_black}▎ {highlight}%ledger_owner% <currency>"
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Movements {letters_black}» {info}%ledger_size%"
