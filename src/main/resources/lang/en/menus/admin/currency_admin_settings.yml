# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The economy's switches that belong to no one currency.

title: "{primary}&lECONOMY SETTINGS"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  experience-levels:
    slot: 11
    material: "%experience_levels_material%"
    name: "{primary}&lEXPERIENCE LEVELS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Makes xp_levels a currency"
      - " {letters_black}▎ {letters}shops can price in."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %experience_levels_status%"
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle experience_levels"

  experience-points:
    slot: 12
    material: "%experience_points_material%"
    name: "{primary}&lEXPERIENCE POINTS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Makes xp_points a currency"
      - " {letters_black}▎ {letters}shops can price in."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %experience_points_status%"
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle experience_points"

  vault-provide:
    slot: 14
    material: "GOLD_BLOCK"
    name: "{primary}&lVAULT ECONOMY"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}The stored currency Vault serves."
      - " {letters_black}▎ {letters}Choose it from that currency's screen."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Published {letters_black}» {highlight}%vault_provide%"
      - ""

  vault-force:
    slot: 15
    material: "%vault_force_material%"
    name: "{primary}&lVAULT ON TOP"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Serves Vault even when another"
      - " {letters_black}▎ {letters}economy plugin is installed."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %vault_force_status%"
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle vault_force"

  ledger:
    slot: 20
    material: "%ledger_material%"
    name: "{primary}&lLEDGER"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Writes down every stored operation"
      - " {letters_black}▎ {letters}for the history screen."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %ledger_status%"
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle ledger"

  ledger-days:
    slot: 21
    material: "CLOCK"
    name: "{primary}&lLEDGER RETENTION"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Older lines are deleted every hour."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Kept for {letters_black}» {info}%ledger_days%"
      - ""
      - "{warning}➥ Click to change"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle ledger_days"

  offline-pay-notice:
    slot: 22
    material: "%offline_pay_notice_material%"
    name: "{primary}&lOFFLINE PAY NOTICE"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Tells players on join what they"
      - " {letters_black}▎ {letters}were paid while offline."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %offline_pay_notice_status%"
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle offline_pay_notice"

  language:
    slot: 23
    material: "WRITABLE_BOOK"
    name: "{primary}&lLANGUAGE"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Default follows ExyliaLib's language."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» {highlight}%language%"
      - ""
      - "{warning}➥ Click to change"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle language"

  debug:
    slot: 24
    material: "%debug_material%"
    name: "{primary}&lDEBUG"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Explains in the console what the"
      - " {letters_black}▎ {letters}plugin is doing."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %debug_status%"
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle debug"

  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lBACK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Returns to the currency list."
      - ""
      - "{warning}➥ Click to go back"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_open_list"
