# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The interest one stored currency pays its holders.

title: "{primary}&lINTEREST {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  interest:
    slot: 12
    material: "EXPERIENCE_BOTTLE"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Interest</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Paid to players with the"
      - " {letters}interest permission."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:gold} {letters}Rate{letters_black}: {info}%currency_interest_rate%"
      - "  {letters_black}· {info}{icon:clock} {letters}Every{letters_black}: {info}%currency_interest_interval%"
      - "  {letters_black}· {info}{icon:hopper} {letters}Most per payout{letters_black}: {info}%currency_interest_max%"
      - ""
      - "{primary}{icon:click} Click to edit"
    actions:
      - "exyliaeconomy:currency_admin_interest %currency_id%"

  interest-offline:
    slot: 14
    material: "%interest_offline_material%"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Interest while offline</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Also pays players who are offline,"
      - " {letters}without checking their permission."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Current{letters_black}: %interest_offline_status%"
      - ""
      - "{primary}{icon:click} Click to toggle"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% interest_offline"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Currency</gradient>"
    lore:
      - "{error}{icon:click} Click to go back"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
