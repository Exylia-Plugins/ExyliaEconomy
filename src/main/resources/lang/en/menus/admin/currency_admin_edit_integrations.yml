# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Where else one stored currency shows up: its board, the network and Vault.

title: "{primary}&lINTEGRATIONS {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  leaderboard:
    slot: 11
    material: "%leaderboard_material%"
    name: "{primary}&lLEADERBOARD"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Whether its top list and"
      - " {letters_black}▎ {letters}placeholders work."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %leaderboard_status%"
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% leaderboard"

  networked:
    slot: 13
    material: "%networked_material%"
    name: "{primary}&lSHARED ACROSS SERVERS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}On, one balance across the network;"
      - " {letters_black}▎ {letters}off, one per server. Each set is kept"
      - " {letters_black}▎ {letters}apart, so switching back restores it."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %networked_status%"
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% networked"

  vault:
    slot: 15
    material: "%vault_material%"
    name: "{primary}&lVAULT ECONOMY"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Publishes it as the server's Vault"
      - " {letters_black}▎ {letters}economy, replacing the previous one."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %vault_status%"
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% vault"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lBACK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Returns to the currency overview."
      - ""
      - "{warning}➥ Click to go back"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
