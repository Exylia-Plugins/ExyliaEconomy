# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Where else one stored currency shows up: its board, the network and Vault.

title: "{primary}&lINTEGRATIONS {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  leaderboard:
    slot: 12
    material: "%leaderboard_material%"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Leaderboard</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Whether its top list"
      - " {letters}and placeholders work."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Current{letters_black}: %leaderboard_status%"
      - ""
      - "{primary}{icon:click} Click to toggle"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% leaderboard"

  networked:
    slot: 13
    material: "%networked_material%"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Shared across servers</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}On, one balance across the"
      - " {letters}network; off, one per server."
      - " {letters}Each set is kept apart, so"
      - " {letters}switching back restores it."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Current{letters_black}: %networked_status%"
      - ""
      - "{primary}{icon:click} Click to toggle"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% networked"

  vault:
    slot: 14
    material: "%vault_material%"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Vault economy</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Publishes it as the"
      - " {letters}server's Vault economy,"
      - " {letters}replacing the previous one."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Current{letters_black}: %vault_status%"
      - ""
      - "{primary}{icon:click} Click to toggle"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% vault"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Currency</gradient>"
    lore:
      - "{error}{icon:click} Click to go back"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
