# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One currency: an overview that opens each section of it. A stored
# currency has every section; an item currency its item, commands and
# pay confirmation; a display-only one its look and pay confirmation.

title: "{primary}&lCURRENCY {letters_black}» {highlight}%currency_id%"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  summary:
    slot: 4
    material: "%currency_icon%"
    name: "{primary}&l%currency_plural%"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}ID {letters_black}» {info}%currency_id%"
      - " {letters_black}▎ {letters}Kind {letters_black}» {info}%currency_kind_label%"
      - ""
      - "{secondary}Preview:"
      - " {letters_black}▎ {letters}Full {letters_black}» {letters}%currency_preview%"
      - " {letters_black}▎ {letters}Compact {letters_black}» {letters}%currency_preview_compact%"
      - ""

  general:
    slot: 19
    material: "NAME_TAG"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lGENERAL"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Names, amounts, icon and order."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Name {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Looks like {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands:
    slot: 20
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lCOMMANDS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}What players type to use it."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Names {letters_black}» {info}%currency_aliases%"
      - " {letters_black}▎ {letters}Enabled {letters_black}» %commands_status%"
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% commands"

  rules:
    slot: 21
    material: "BOOK"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lRULES"
    lore:
      - ""
      - "{secondary}Balances:"
      - " {letters_black}▎ {letters}Start {letters_black}» {info}%currency_start%"
      - " {letters_black}▎ {letters}Ceiling {letters_black}» {info}%currency_max%"
      - " {letters_black}▎ {letters}Permission {letters_black}» {info}%currency_permission%"
      - ""
      - "{secondary}Transfers:"
      - " {letters_black}▎ {letters}Minimum {letters_black}» {info}%currency_minimum_transfer%"
      - " {letters_black}▎ {letters}Tax {letters_black}» {info}%currency_tax%"
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_rules %currency_id%"

  payments:
    slot: 22
    material: "GOLD_NUGGET"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lPAYMENTS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Transfers, confirmations and notes."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Transfers {letters_black}» %transferable_status%"
      - " {letters_black}▎ {letters}Asks above {letters_black}» {info}%currency_pay_confirm%"
      - " {letters_black}▎ {letters}Banknotes {letters_black}» %banknotes_status%"
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% payments"

  exchange:
    slot: 23
    material: "SUNFLOWER"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lEXCHANGE"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Swapping it for other currencies."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Exchange {letters_black}» %exchangeable_status%"
      - " {letters_black}▎ {letters}Rates {letters_black}» {info}%currency_rates%"
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% exchange"

  interest:
    slot: 24
    material: "EXPERIENCE_BOTTLE"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lINTEREST"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}What it pays its holders over time."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Rate {letters_black}» {info}%currency_interest_rate%"
      - " {letters_black}▎ {letters}Every {letters_black}» {info}%currency_interest_interval% ⌚"
      - " {letters_black}▎ {letters}Offline {letters_black}» %interest_offline_status%"
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% interest"

  integrations:
    slot: 25
    material: "ENDER_EYE"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lINTEGRATIONS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Its leaderboard, Vault and the network."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Leaderboard {letters_black}» %leaderboard_status%"
      - " {letters_black}▎ {letters}Network {letters_black}» %networked_status%"
      - " {letters_black}▎ {letters}Vault {letters_black}» %vault_status%"
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% integrations"

  general-item:
    slot: 20
    material: "NAME_TAG"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lGENERAL"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Names, amounts, icon and order."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Name {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Looks like {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands-item:
    slot: 21
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lCOMMANDS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}The first is the command,"
      - " {letters_black}▎ {letters}the rest are its aliases."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Names {letters_black}» {info}%currency_aliases%"
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_aliases %currency_id%"

  item:
    slot: 23
    material: "%currency_item_icon%"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lITEM"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Only stacks exactly like it count:"
      - " {letters_black}▎ {letters}name, lore and model included."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Item {letters_black}» %currency_item_state%"
      - ""
      - "{warning}➥ Click to put in a new one"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_item %currency_id%"

  pay-confirm-item:
    slot: 24
    material: "PAPER"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lPAY CONFIRMATION"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}A /pay above it asks the payer first."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Asks above {letters_black}» {info}%currency_pay_confirm%"
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_pay_confirm %currency_id%"

  general-display:
    slot: 21
    material: "NAME_TAG"
    condition: "%currency_kind% == DISPLAY"
    name: "{primary}&lGENERAL"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Names, amounts, icon and order."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Name {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Looks like {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  pay-confirm-display:
    slot: 23
    material: "PAPER"
    condition: "%currency_kind% == DISPLAY"
    name: "{primary}&lPAY CONFIRMATION"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}A /pay above it asks the payer first."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Asks above {letters_black}» {info}%currency_pay_confirm%"
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_pay_confirm %currency_id%"

  back:
    slot: 40
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lBACK"
    lore:
      - ""
      - " {letters_black}▎ {letters}Returns to the currency list."
      - ""
      - "{warning}➥ Click to go back"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_open_list"

  delete:
    slot: 44
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0="
    name: "{error}&lDELETE CURRENCY"
    lore:
      - ""
      - " {letters_black}▎ {letters}Removes the currency. Stored balances"
      - " {letters_black}▎ {letters}stay in the database, unused."
      - " {letters_black}▎ {letters_black}You will be asked to confirm."
      - ""
      - "{error}➥ Click to delete"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_delete %currency_id%"
