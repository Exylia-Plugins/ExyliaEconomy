      - ""
      - "{primary}✎ Information"
      - " {letters}Only stacks exactly like it count:"
      - " {letters}name, lore and model included."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:check} {letters}Item{letters_black}: %currency_item_state%"
      - ""
      - "{primary}{icon:click} Click to put in a new one"
    actions:
      - "exyliaeconomy:currency_admin_item %currency_id%"

  pay-confirm-item:
    slot: 15
    material: "PAPER"
    condition: "%currency_kind% == ITEM"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Pay confirmation</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}A /pay above it asks"
      - " {letters}the payer first."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:hopper} {letters}Asks above{letters_black}: {info}%currency_pay_confirm%"
