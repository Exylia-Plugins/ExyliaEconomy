# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One currency. What a button offers depends on its kind: a stored currency
# has rules and switches, an item currency its item, a display-only one only
# its look.

title: "{primary}&lCURRENCY {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: BLACK_STAINED_GLASS_PANE
    hide_tooltip: true

  custom:
    frame:
      material: GRAY_STAINED_GLASS_PANE
      hide_tooltip: true
      slots: "0-8,27-35"

items:
  summary:
    slot: 4
    material: "%currency_icon%"
    name: "{primary}&l%currency_plural%"
    lore:
      - ""
      - "{secondary}Currency:"
      - " {letters_black}▎ {letters}Id {letters_black}» {highlight}%currency_id%"
      - " {letters_black}▎ {letters}Kind {letters_black}» {info}%currency_kind_label%"
      - ""
      - "{secondary}Preview:"
      - " {letters_black}▎ {letters}Full {letters_black}» {letters}%currency_preview%"
      - " {letters_black}▎ {letters}Compact {letters_black}» {letters}%currency_preview_compact%"
      - ""

  icon:
    slot: 10
    material: "%currency_icon%"
    name: "{primary}&lICON"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}What wallets and lists draw it as."
      - ""
      - "{warning}➥ Click to choose one"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_icon %currency_id%"

  appearance:
    slot: 11
    material: NAME_TAG
    name: "{primary}&lAPPEARANCE"
    lore:
      - ""
      - "{secondary}Names:"
      - " {letters_black}▎ {letters}Name {letters_black}» {letters}%currency_name%"
      - " {letters_black}▎ {letters}Plural {letters_black}» {letters}%currency_plural%"
      - " {letters_black}▎ {letters}Symbol {letters_black}» {letters}%currency_symbol%"
      - ""
      - "{secondary}Amounts:"
      - " {letters_black}▎ {letters}Decimals {letters_black}» {info}%currency_decimals%"
      - " {letters_black}▎ {letters}Looks like {letters_black}» {letters}%currency_preview%"
      - " {letters_black}▎ {letters}Compact {letters_black}» {letters}%currency_preview_compact%"
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_appearance %currency_id%"

  aliases:
    slot: 12
    material: COMMAND_BLOCK
    condition: "%currency_kind% != DISPLAY"
    name: "{primary}&lCOMMANDS"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Names {letters_black}» {highlight}%currency_aliases%"
      - " {letters_black}▎ {letters_black}The first is the command, the rest aliases."
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_aliases %currency_id%"

  rules:
    slot: 14
    material: BOOK
    condition: "%currency_kind% == STORED"
    name: "{primary}&lRULES"
    lore:
      - ""
      - "{secondary}Balances:"
      - " {letters_black}▎ {letters}Start {letters_black}» {info}%currency_start%"
      - " {letters_black}▎ {letters}Ceiling {letters_black}» {info}%currency_max%"
      - " {letters_black}▎ {letters}Permission {letters_black}» {highlight}%currency_permission%"
      - ""
      - "{secondary}Transfers:"
      - " {letters_black}▎ {letters}Minimum {letters_black}» {info}%currency_minimum_transfer%"
      - " {letters_black}▎ {letters}Tax {letters_black}» {info}%currency_tax%"
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_rules %currency_id%"

  item:
    slot: 14
    material: "%currency_item_icon%"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lITEM"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Item {letters_black}» %currency_item_state%"
      - " {letters_black}▎ {letters_black}Only stacks exactly like it count:"
      - " {letters_black}▎ {letters_black}name, lore and model included."
      - ""
      - "{warning}➥ Click to put in a new one"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_item %currency_id%"

  rates:
    slot: 15
    material: SUNFLOWER
    condition: "%currency_kind% == STORED"
    name: "{primary}&lEXCHANGE RATES"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Rates {letters_black}» {info}%currency_rates%"
      - " {letters_black}▎ {letters_black}shards=0.01 means 1 of this is 0.01 shards."
      - " {letters_black}▎ {letters_black}Only used while exchange is on."
      - ""
      - "{warning}➥ Click to edit"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_rates %currency_id%"

  sort-order:
    slot: 16
    material: HOPPER
    name: "{primary}&lSORT ORDER"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Current {letters_black}» {info}%currency_sort_order%"
      - " {letters_black}▎ {letters_black}Lower is shown first."
      - ""
      - "{warning}➥ Click to set it"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_sort %currency_id%"

  transferable:
    slot: 19
    material: "%transferable_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lTRANSFERS"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %transferable_status%"
      - " {letters_black}▎ {letters_black}Whether players can pay each other."
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% transferable"

  exchangeable:
    slot: 20
    material: "%exchangeable_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lEXCHANGE"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %exchangeable_status%"
      - " {letters_black}▎ {letters_black}Whether it can be swapped at its rates."
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% exchangeable"

  leaderboard:
    slot: 21
    material: "%leaderboard_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lLEADERBOARD"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %leaderboard_status%"
      - " {letters_black}▎ {letters_black}Whether its top list and placeholders work."
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% leaderboard"

  networked:
    slot: 23
    material: "%networked_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lSHARED ACROSS SERVERS"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %networked_status%"
      - " {letters_black}▎ {letters_black}On, one balance across the network;"
      - " {letters_black}▎ {letters_black}off, one per server. Each set is kept"
      - " {letters_black}▎ {letters_black}apart, so switching back restores it."
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% networked"

  commands:
    slot: 24
    material: "%commands_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lCOMMANDS ENABLED"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %commands_status%"
      - " {letters_black}▎ {letters_black}Whether its command names exist at all."
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% commands"

  vault:
    slot: 25
    material: "%vault_material%"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lVAULT ECONOMY"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Current {letters_black}» %vault_status%"
      - " {letters_black}▎ {letters_black}Publishes it as the server's Vault economy,"
      - " {letters_black}▎ {letters_black}replacing whichever currency was."
      - ""
      - "{warning}➥ Click to toggle"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% vault"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: '{error}&lBACK'
    lore:
      - ""
      - " {letters_black}▎ {letters}Returns to the currency list"
      - ""
      - "{warning}➥ Click to go back"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_open_list"

  delete:
    slot: 35
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmUwZmQxMDE5OWU4ZTRmY2RhYmNhZTRmODVjODU5MTgxMjdhN2M1NTUzYWQyMzVmMDFjNTZkMThiYjk0NzBkMyJ9fX0='
    name: "{error}&lDELETE CURRENCY"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Removes the currency. Stored balances"
      - " {letters_black}▎ {letters}stay in the database, unused."
      - " {letters_black}▎ {letters_black}You will be asked to confirm."
      - ""
      - "{error}➥ Click to delete"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_delete %currency_id%"
