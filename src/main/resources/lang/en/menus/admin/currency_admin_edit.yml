      - "{letters_black}Setup section"
      - ""
      - "{primary}✎ Information"
      - " {letters}What it pays its holders over time."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:gold} {letters}Rate{letters_black}: {info}%currency_interest_rate%"
      - "  {letters_black}· {info}{icon:clock} {letters}Every{letters_black}: {info}%currency_interest_interval%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Offline{letters_black}: %interest_offline_status%"
      - ""
      - "{primary}{icon:click} Click to open"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% interest"

  integrations:
    slot: 23
    material: "ENDER_EYE"
    condition: "%currency_kind% == STORED"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Integrations</gradient>"
    lore:
      - "{letters_black}Setup section"
      - ""
      - "{primary}✎ Information"
      - " {letters}Its leaderboard, Vault"
      - " {letters}and the network."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Leaderboard{letters_black}: %leaderboard_status%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Network{letters_black}: %networked_status%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Vault{letters_black}: %vault_status%"
      - ""
      - "{primary}{icon:click} Click to open"
