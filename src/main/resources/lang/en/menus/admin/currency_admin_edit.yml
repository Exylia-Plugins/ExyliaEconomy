      - "exyliaeconomy:currency_admin_page %currency_id% payments"

  exchange:
    slot: 21
    material: "SUNFLOWER"
    condition: "%currency_kind% == STORED"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Exchange</gradient>"
    lore:
      - "{letters_black}Setup section"
      - ""
      - "{primary}✎ Information"
      - " {letters}Swapping it for other currencies."
      - ""
      - "{primary}✦ Status"
