# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One currency: an overview that opens each section of it. A stored
# currency has every section; an item currency its item, commands and
# pay confirmation; a display-only one its look and pay confirmation.

title: "{primary}&lCURRENCY {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  summary:
    slot: 4
    material: "%currency_icon%"
    name: "<gradient:{primary}:{secondary_light}>%currency_plural%</gradient>"
    lore:
      - "{letters_black}Currency overview"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%currency_id%"
      - "  {letters_black}· {info}{icon:tag} {letters}Kind{letters_black}: {info}%currency_kind_label%"
      - ""
      - "{primary}✦ Preview"
      - "  {letters_black}· {info}{icon:eye} {letters}Full{letters_black}: {letters}%currency_preview%"
      - "  {letters_black}· {info}{icon:eye} {letters}Compact{letters_black}: {letters}%currency_preview_compact%"

  general:
    slot: 11
    material: "NAME_TAG"
    condition: "%currency_kind% == STORED"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>General</gradient>"
    lore:
      - "{letters_black}Setup section"
      - ""
      - "{primary}✎ Information"
      - " {letters}Names, amounts, icon and order."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Name{letters_black}: {info}%currency_name%"
      - ""
      - "{primary}{icon:click} Click to open"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands:
    slot: 12
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == STORED"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Commands</gradient>"
    lore:
      - "{letters_black}Setup section"
      - ""
      - "{primary}✎ Information"
      - " {letters}What players type to use it."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:tag} {letters}Names{letters_black}: {info}%currency_aliases%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Enabled{letters_black}: %commands_status%"
      - ""
      - "{primary}{icon:click} Click to open"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% commands"

  rules:
    slot: 14
    material: "BOOK"
    condition: "%currency_kind% == STORED"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Rules</gradient>"
    lore:
      - "{letters_black}Currency setting"
      - ""
      - "{primary}♦ Balances"
      - "  {letters_black}· {info}{icon:gold} {letters}Start{letters_black}: {info}%currency_start%"
      - "  {letters_black}· {info}{icon:hopper} {letters}Ceiling{letters_black}: {info}%currency_max%"
      - "  {letters_black}· {info}{icon:key} {letters}Permission{letters_black}: {info}%currency_permission%"
      - ""
      - "{primary}♦ Transfers"
      - "  {letters_black}· {info}{icon:hopper} {letters}Minimum{letters_black}: {info}%currency_minimum_transfer%"
      - "  {letters_black}· {info}{icon:gold} {letters}Tax{letters_black}: {info}%currency_tax%"
      - ""
      - "{primary}{icon:click} Click to edit"
    actions:
      - "exyliaeconomy:currency_admin_rules %currency_id%"

  payments:
    slot: 15
    material: "GOLD_NUGGET"
    condition: "%currency_kind% == STORED"
    name: "{letters}Currency {letters_black}▸ <gradient:{primary}:{secondary_light}>Payments</gradient>"
    lore:
      - "{letters_black}Setup section"
      - ""
      - "{primary}✎ Information"
      - " {letters}Transfers, confirmations and notes."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Transfers{letters_black}: %transferable_status%"
      - "  {letters_black}· {info}{icon:hopper} {letters}Asks above{letters_black}: {info}%currency_pay_confirm%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Banknotes{letters_black}: %banknotes_status%"
      - ""
      - "{primary}{icon:click} Click to open"
