# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The commands of one stored currency.

title: "{primary}&lCOMMANDES {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  aliases:
    slot: 12
    material: "COMMAND_BLOCK"
    name: "{primary}&lNOMS DE COMMANDE"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Le premier est la commande ;"
      - " {letters_black}▎ {letters}les autres, ses alias."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Noms {letters_black}» {info}%currency_aliases%"
      - ""
      - "{warning}➥ Clique pour modifier"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_aliases %currency_id%"

  commands:
    slot: 14
    material: "%commands_material%"
    name: "{primary}&lCOMMANDES ACTIVÉES"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Si ses commandes existent."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Actuel {letters_black}» %commands_status%"
      - ""
      - "{warning}➥ Clique pour basculer"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% commands"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lRETOUR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Retourne au résumé de la monnaie."
      - ""
      - "{warning}➥ Clique pour revenir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
