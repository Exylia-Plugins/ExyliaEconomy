# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The commands of one stored currency.

title: "{primary}&lCOMMANDES {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  aliases:
    slot: 12
    material: "COMMAND_BLOCK"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>Noms de commande</gradient>"
    lore:
      - "{letters_black}Réglage de la monnaie"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Le premier est la commande"
      - " {letters}; les autres, ses alias."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:tag} {letters}Noms{letters_black}: {info}%currency_aliases%"
      - ""
      - "{primary}{icon:click} Clique pour modifier"
    actions:
      - "exyliaeconomy:currency_admin_aliases %currency_id%"

  commands:
    slot: 14
    material: "%commands_material%"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>Commandes activées</gradient>"
    lore:
      - "{letters_black}Réglage de la monnaie"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Si ses commandes existent."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:redstone} {letters}Actuel{letters_black}: %commands_status%"
      - ""
      - "{primary}{icon:click} Clique pour basculer"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% commands"

