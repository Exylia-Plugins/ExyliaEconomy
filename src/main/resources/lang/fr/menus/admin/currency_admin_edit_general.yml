# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The look of one currency: its names, amounts, icon and place in lists.

title: "{primary}&lGÉNÉRAL {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  icon:
    slot: 11
    material: "%currency_icon%"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>Icône</gradient>"
    lore:
      - "{letters_black}Réglage de la monnaie"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Comment elle s'affiche dans"
      - " {letters}les portefeuilles et listes."
      - ""
      - "{primary}» Clique pour en choisir une"
    actions:
      - "exyliaeconomy:currency_admin_icon %currency_id%"

  appearance:
    slot: 13
    material: "NAME_TAG"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>Apparence</gradient>"
    lore:
      - "{letters_black}Réglage de la monnaie"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Comment s'écrit chaque montant."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:tag} {letters}Nom{letters_black}: {letters}%currency_name%"
      - "  {letters_black}· {info}{icon:tag} {letters}Pluriel{letters_black}: {letters}%currency_plural%"
      - "  {letters_black}· {info}{icon:tag} {letters}Symbole{letters_black}: {letters}%currency_symbol%"
      - "  {letters_black}· {info}{icon:iron} {letters}Décimales{letters_black}: {info}%currency_decimals%"
      - "  {letters_black}· {info}{icon:eye} {letters}Rendu{letters_black}: {letters}%currency_preview%"
      - "  {letters_black}· {info}{icon:eye} {letters}Compacte{letters_black}: {letters}%currency_preview_compact%"
      - ""
      - "{primary}» Clique pour modifier"
    actions:
      - "exyliaeconomy:currency_admin_appearance %currency_id%"

  sort-order:
    slot: 15
    material: "HOPPER"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>Ordre</gradient>"
    lore:
      - "{letters_black}Réglage de la monnaie"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Le plus petit s'affiche en"
      - " {letters}premier dans les listes."
      - ""
      - "{primary}✦ État"
