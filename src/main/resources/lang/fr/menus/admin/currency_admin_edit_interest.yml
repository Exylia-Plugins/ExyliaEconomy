# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The interest one stored currency pays its holders.

title: "{primary}&lINTÉRÊTS {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  interest:
    slot: 12
    material: "EXPERIENCE_BOTTLE"
    name: "{primary}&lINTÉRÊTS"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Versés aux joueurs ayant la"
      - " {letters_black}▎ {letters}permission d'intérêts."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Taux {letters_black}» {info}%currency_interest_rate%"
      - " {letters_black}▎ {letters}Chaque {letters_black}» {info}%currency_interest_interval% ⌚"
      - " {letters_black}▎ {letters}Maximum par versement {letters_black}» {info}%currency_interest_max%"
      - ""
      - "{warning}➥ Clique pour modifier"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_interest %currency_id%"

  interest-offline:
    slot: 14
    material: "%interest_offline_material%"
    name: "{primary}&lINTÉRÊTS HORS LIGNE"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Verse aussi aux joueurs hors ligne,"
      - " {letters_black}▎ {letters}sans vérifier leur permission."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Actuel {letters_black}» %interest_offline_status%"
      - ""
      - "{warning}➥ Clique pour basculer"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% interest_offline"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lRETOUR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Retourne au résumé de la monnaie."
      - ""
      - "{warning}➥ Clique pour revenir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
