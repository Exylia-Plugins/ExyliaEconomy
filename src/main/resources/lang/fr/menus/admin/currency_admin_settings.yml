    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  experience-levels:
    slot: 11
    material: "%experience_levels_material%"
    name: "{primary}&lNIVEAUX D'EXPÉRIENCE"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Fait de xp_levels une monnaie"
      - " {letters_black}▎ {letters}que les boutiques peuvent encaisser."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Actuel {letters_black}» %experience_levels_status%"
      - ""
      - "{warning}➥ Clique pour basculer"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_settings_toggle experience_levels"

  experience-points:
