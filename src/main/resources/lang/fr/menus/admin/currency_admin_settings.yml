      - "{letters_black}Réglage de l'économie"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Fait de xp_levels une monnaie que"
      - " {letters}les boutiques peuvent encaisser."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:redstone} {letters}Actuel{letters_black}: %experience_levels_status%"
      - ""
      - "{primary}» Clique pour basculer"
