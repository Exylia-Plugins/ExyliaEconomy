# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Every currency the server runs, kept in the database. /economyadmin

title: "{primary}&lMONNAIES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus aucune monnaie"
    lore:
      - "{letters_black}Crée-en une avec le bouton ci-dessous."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Première page"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Dernière page →"

pagination:
  slots: '0-35'

  item_template:
    material: "%currency_icon%"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>%currency_name%</gradient>"
    lore:
      - "{letters_black}Monnaie · %currency_id%"
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:tag} {letters}Type{letters_black}: {info}%currency_kind%"
      - "  {letters_black}· {info}{icon:iron} {letters}Ordre{letters_black}: {info}%currency_sort_order%"
      - ""
      - "{primary}✦ Aperçu"
      - "  {letters_black}· {info}{icon:eye} {letters}Rendu{letters_black}: {letters}%currency_preview%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}modifier"
      - "{error}{icon:right_click} Clic droit {letters_black}· {letters}supprimer"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - "left: exyliaeconomy:currency_admin_edit %currency_id%"
      - "right: exyliaeconomy:currency_admin_delete %currency_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
