      - "{secondary}Aperçu :"
      - " {letters_black}▎ {letters}Rendu {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Clic gauche pour modifier"
      - "{error}➥ Clic droit pour supprimer"
      - ""
