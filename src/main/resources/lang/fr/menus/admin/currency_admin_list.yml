    lore:
      - ""
      - " {letters_black}▎ {letters}Crée-en une avec le bouton ci-dessous."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%currency_icon%"
    name: "{primary}&l%currency_name%"
