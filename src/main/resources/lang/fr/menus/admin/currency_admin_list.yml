items:
  create:
    slot: 45
    material: "EMERALD_BLOCK"
    name: "{letters}Monnaies {letters_black}▸ <gradient:{success}:{success_light}>Créer une monnaie</gradient>"
    lore:
      - "{letters_black}Nouvelle monnaie"
      - ""
      - "{success}✦ Types"
      - "  {letters_black}· {highlight}Stockée{letters_black}: {letters}soldes en base de données"
      - "  {letters_black}· {highlight}Objet{letters_black}: {letters}un objet exact que portent les joueurs"
      - "  {letters_black}· {highlight}Visuelle{letters_black}: {letters}habille celle d'un autre plugin"
      - ""
      - "{success}{icon:click} Clique pour créer"
    actions:
      - "exyliaeconomy:currency_admin_create"

  settings:
    slot: 53
    material: "COMPARATOR"
    name: "{letters}Plugin {letters_black}▸ <gradient:{primary}:{secondary_light}>Paramètres d'économie</gradient>"
    lore:
      - "{letters_black}Configuration"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Monnaies d'expérience, journal,"
      - " {letters}Vault, langue et débogage."
