# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# What one stored currency is worth in the others.

title: "{primary}&lCHANGE {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  exchangeable:
    slot: 12
    material: "%exchangeable_material%"
    name: "{primary}&lCHANGE"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Si elle peut être changée selon ses taux."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Actuel {letters_black}» %exchangeable_status%"
      - ""
      - "{warning}➥ Clique pour basculer"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% exchangeable"

  rates:
    slot: 14
    material: "SUNFLOWER"
    name: "{primary}&lTAUX DE CHANGE"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}shards=0.01 : 1 de celle-ci vaut"
      - " {letters_black}▎ {letters}0.01 shards. Utilisé uniquement"
      - " {letters_black}▎ {letters}si le change est activé."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Taux {letters_black}» {info}%currency_rates%"
      - ""
      - "{warning}➥ Clique pour modifier"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_rates %currency_id%"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lRETOUR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Retourne au résumé de la monnaie."
      - ""
      - "{warning}➥ Clique pour revenir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
