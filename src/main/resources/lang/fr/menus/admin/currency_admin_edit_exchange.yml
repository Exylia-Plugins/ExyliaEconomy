    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  exchangeable:
    slot: 12
    material: "%exchangeable_material%"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>Change</gradient>"
    lore:
      - "{letters_black}Réglage de la monnaie"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Si elle peut être"
      - " {letters}changée selon ses taux."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:redstone} {letters}Actuel{letters_black}: %exchangeable_status%"
      - ""
      - "{primary}» Clique pour basculer"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% exchangeable"

  rates:
    slot: 14
    material: "SUNFLOWER"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>Taux de change</gradient>"
    lore:
      - "{letters_black}Réglage de la monnaie"
      - ""
      - "{primary}✎ Informations"
      - " {letters}shards=0.01 : 1 de celle-ci vaut"
      - " {letters}0.01 shards. Utilisé uniquement"
      - " {letters}si le change est activé."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:emerald} {letters}Taux{letters_black}: {info}%currency_rates%"
      - ""
      - "{primary}» Clique pour modifier"
    actions:
      - "exyliaeconomy:currency_admin_rates %currency_id%"

