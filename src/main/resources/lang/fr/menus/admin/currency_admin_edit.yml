# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One currency: an overview that opens each section of it. A stored
# currency has every section; an item currency its item, commands and
# pay confirmation; a display-only one its look and pay confirmation.

title: "{primary}&lMONNAIE {letters_black}» {highlight}%currency_id%"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  summary:
    slot: 4
    material: "%currency_icon%"
    name: "{primary}&l%currency_plural%"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}ID {letters_black}» {info}%currency_id%"
      - " {letters_black}▎ {letters}Type {letters_black}» {info}%currency_kind_label%"
      - ""
      - "{secondary}Aperçu :"
      - " {letters_black}▎ {letters}Complète {letters_black}» {letters}%currency_preview%"
      - " {letters_black}▎ {letters}Compacte {letters_black}» {letters}%currency_preview_compact%"
      - ""

  general:
    slot: 19
    material: "NAME_TAG"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lGÉNÉRAL"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Noms, montants, icône et ordre."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Nom {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Rendu {letters_black}» {letters}%currency_preview%"
      - ""
      - "{warning}➥ Clique pour ouvrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands:
    slot: 20
    material: "COMMAND_BLOCK"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lCOMMANDES"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Ce que les joueurs saisissent pour l'utiliser."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Noms {letters_black}» {info}%currency_aliases%"
      - " {letters_black}▎ {letters}Activées {letters_black}» %commands_status%"
      - ""
      - "{warning}➥ Clique pour ouvrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% commands"

  rules:
    slot: 21
    material: "BOOK"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lRÈGLES"
    lore:
      - ""
      - "{secondary}Soldes :"
      - " {letters_black}▎ {letters}Initial {letters_black}» {info}%currency_start%"
      - " {letters_black}▎ {letters}Plafond {letters_black}» {info}%currency_max%"
      - " {letters_black}▎ {letters}Permission {letters_black}» {info}%currency_permission%"
      - ""
      - "{secondary}Transferts :"
      - " {letters_black}▎ {letters}Minimum {letters_black}» {info}%currency_minimum_transfer%"
      - " {letters_black}▎ {letters}Taxe {letters_black}» {info}%currency_tax%"
      - ""
      - "{warning}➥ Clique pour modifier"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_rules %currency_id%"

  payments:
    slot: 22
    material: "GOLD_NUGGET"
    condition: "%currency_kind% == STORED"
    name: "{primary}&lPAIEMENTS"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Transferts, confirmations et billets."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Transferts {letters_black}» %transferable_status%"
      - " {letters_black}▎ {letters}Confirmation dès {letters_black}» {info}%currency_pay_confirm%"
      - " {letters_black}▎ {letters}Billets {letters_black}» %banknotes_status%"
      - ""
      - "{warning}➥ Clique pour ouvrir"
