      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}La changer contre d'autres monnaies."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Change {letters_black}» %exchangeable_status%"
      - " {letters_black}▎ {letters}Taux {letters_black}» {info}%currency_rates%"
      - ""
      - "{warning}➥ Clique pour ouvrir"
