# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One currency: an overview that opens each section of it. A stored
# currency has every section; an item currency its item, commands and
# pay confirmation; a display-only one its look and pay confirmation.

title: "{primary}&lMONNAIE {letters_black}» {highlight}%currency_id%"
size: 45
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  summary:
    slot: 4
    material: "%currency_icon%"
    name: "<gradient:{primary}:{secondary_light}>%currency_plural%</gradient>"
    lore:
      - "{letters_black}Aperçu de la monnaie"
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:tag} {letters}ID{letters_black}: {info}%currency_id%"
      - "  {letters_black}· {info}{icon:tag} {letters}Type{letters_black}: {info}%currency_kind_label%"
      - ""
      - "{primary}✦ Aperçu"
      - "  {letters_black}· {info}{icon:eye} {letters}Complète{letters_black}: {letters}%currency_preview%"
      - "  {letters_black}· {info}{icon:eye} {letters}Compacte{letters_black}: {letters}%currency_preview_compact%"

  general:
    slot: 19
    material: "NAME_TAG"
    condition: "%currency_kind% == STORED"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>Général</gradient>"
    lore:
      - "{letters_black}Section de config"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Noms, montants, icône et ordre."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:tag} {letters}Nom{letters_black}: {info}%currency_name%"
      - ""
      - "{primary}» Clique pour ouvrir"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% general"

  commands:
