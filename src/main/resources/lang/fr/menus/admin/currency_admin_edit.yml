      - " {letters_black}▎ {letters}Vault {letters_black}» %vault_status%"
      - ""
      - "{warning}➥ Clique pour ouvrir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% integrations"

  general-item:
    slot: 20
    material: "NAME_TAG"
    condition: "%currency_kind% == ITEM"
    name: "{primary}&lGÉNÉRAL"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Noms, montants, icône et ordre."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Nom {letters_black}» {info}%currency_name%"
      - " {letters_black}▎ {letters}Rendu {letters_black}» {letters}%currency_preview%"
