# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Where else one stored currency shows up: its board, the network and Vault.

title: "{primary}&lINTÉGRATIONS {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  leaderboard:
    slot: 12
    material: "%leaderboard_material%"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>Top</gradient>"
    lore:
      - "{letters_black}Réglage de la monnaie"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Si son top et ses placeholders."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:redstone} {letters}Actuel{letters_black}: %leaderboard_status%"
      - ""
      - "{primary}{icon:click} Clique pour basculer"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% leaderboard"

  networked:
    slot: 13
    material: "%networked_material%"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>Portée réseau</gradient>"
    lore:
      - "{letters_black}Réglage de la monnaie"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Quels serveurs partagent un"
      - " {letters}solde : tous, ceux du groupe"
      - " {letters}du serveur ou celui-ci seul."
      - " {letters}Chacun est gardé à part."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:redstone} {letters}Partagée par{letters_black}: %networked_status%"
      - "  {letters_black}· {info}{icon:compass} {letters}Existe sur{letters_black}: %available_status%"
      - ""
      - "{primary}{icon:click} Clique pour changer"
      - "{letters_black}Tous, groupe, serveur."
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% networked"

  vault:
    slot: 14
    material: "%vault_material%"
    name: "{letters}Monnaie {letters_black}▸ <gradient:{primary}:{secondary_light}>Économie vault</gradient>"
    lore:
      - "{letters_black}Réglage de la monnaie"
      - ""
      - "{primary}✎ Informations"
      - " {letters}La publie comme l'économie"
      - " {letters}Vault du serveur, en"
      - " {letters}remplaçant l'ancienne."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:redstone} {letters}Actuel{letters_black}: %vault_status%"
      - ""
      - "{primary}{icon:click} Clique pour basculer"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% vault"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Retour {letters_black}▸ <gradient:{error}:{error_light}>Monnaie</gradient>"
    lore:
      - "{error}{icon:click} Clique pour revenir"
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
