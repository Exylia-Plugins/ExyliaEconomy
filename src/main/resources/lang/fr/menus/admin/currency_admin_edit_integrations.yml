# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Where else one stored currency shows up: its board, the network and Vault.

title: "{primary}&lINTÉGRATIONS {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  leaderboard:
    slot: 11
    material: "%leaderboard_material%"
    name: "{primary}&lTOP"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Si son top"
      - " {letters_black}▎ {letters}et ses placeholders."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Actuel {letters_black}» %leaderboard_status%"
      - ""
      - "{warning}➥ Clique pour basculer"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% leaderboard"

  networked:
    slot: 13
    material: "%networked_material%"
    name: "{primary}&lPARTAGÉE ENTRE SERVEURS"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Activé : un solde sur tout le réseau ;"
      - " {letters_black}▎ {letters}désactivé : un par serveur. Chacun"
      - " {letters_black}▎ {letters}est conservé séparément ; au retour, il est restauré."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Actuel {letters_black}» %networked_status%"
      - ""
      - "{warning}➥ Clique pour basculer"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% networked"

  vault:
    slot: 15
    material: "%vault_material%"
    name: "{primary}&lÉCONOMIE VAULT"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}La publie comme l'économie Vault"
      - " {letters_black}▎ {letters}du serveur, en remplaçant l'ancienne."
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Actuel {letters_black}» %vault_status%"
      - ""
      - "{warning}➥ Clique pour basculer"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% vault"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{error}&lRETOUR"
    lore:
      - ""
      - " {letters_black}▎ {letters}Retourne au résumé de la monnaie."
      - ""
      - "{warning}➥ Clique pour revenir"
      - ""
    actions:
      - "exyliaeconomy:currency_admin_page %currency_id% hub"
