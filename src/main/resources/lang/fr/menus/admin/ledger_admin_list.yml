# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One player's ledger in one currency, newest first. /economyadmin log <player> [currency]
#
# Values: %ledger_owner% %currency% %currency_icon% %ledger_size%
# Each line: %entry_id% %entry_icon% %entry_delta% %entry_balance% %entry_reason% %entry_when%

title: "{primary}&lREGISTRE {letters_black}» {highlight}%ledger_owner% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus aucun mouvement"
    lore:
      - ""
      - " {letters_black}▎ {letters}Seules les monnaies stockées avec le"
      - " {letters_black}▎ {letters}registre actif gardent leurs mouvements."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%entry_icon%"
    name: "{primary}&lLIGNE #%entry_id% &8[%entry_delta%&8]"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Montant {letters_black}» %entry_delta%"
      - " {letters_black}▎ {letters}Monnaie {letters_black}» {highlight}%currency%"
      - " {letters_black}▎ {letters}Motif {letters_black}» {highlight}%entry_reason%"
      - " {letters_black}▎ {letters}Quand {letters_black}» {info}%entry_when% ⌚"
      - ""
      - "{secondary}État :"
      - " {letters_black}▎ {letters}Solde après {letters_black}» {info}%entry_balance%"
      - ""
      - "{warning}➥ Clique pour ouvrir"
      - ""
    actions:
      - "exyliaeconomy:ledger_admin_entry %entry_id% %currency_id%"

