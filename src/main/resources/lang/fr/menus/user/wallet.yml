# The wallet: every currency somebody holds. /wallet
#
# Yours to restyle: edits are kept across updates. A release that has to
# change the layout raises menu-version below; the file is then replaced
# and your previous one is kept next to it.
#
# Values: %wallet_owner% %wallet_currencies%
# Each currency: %currency% %currency_icon% %currency_balance% %currency_kind%

menu-version: 3

title: "{primary}&lPORTEFEUILLE {letters_black}» {highlight}%wallet_owner% {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus aucune monnaie"
    lore:
      - "{letters_black}Les monnaies que tu peux posséder apparaissent ici."
    hide_tooltip: false
  custom:
    page_first:
      slots: '30'
      material: GRAY_DYE
      name: "{muted}← Première page"
    page_last:
      slots: '32'
      material: GRAY_DYE
      name: "{muted}Dernière page →"

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%currency_icon%"
    name: "{letters}Portefeuille {letters_black}▸ <gradient:{info}:{info_light}>%currency%</gradient>"
    lore:
      - "{letters_black}Monnaie"
      - ""
      - "{info}✦ État"
      - "  {letters_black}· {info}{icon:tag} {letters}Type{letters_black}: {info}%currency_kind%"
      - "  {letters_black}· {success}{icon:gold} {letters}Solde{letters_black}: {success}%currency_balance%"
      - ""
      - "{info}{icon:click} Clic gauche {letters_black}· {letters}historique"
      - "{info}{icon:right_click} Clic droit {letters_black}· {letters}classement"
    actions:
      - "left: exyliaeconomy:economy_history %currency_id% %wallet_owner_id%"
      - "right: exyliaeconomy:economy_top %currency_id%"

  navigation:
    previous:
      slot: 30
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 32
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Suivante →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  owner:
    slot: 31
    material: "playerhead-%wallet_owner%"
    name: "<gradient:{info}:{info_light}>%wallet_owner%</gradient>"
    lore:
      - "{letters_black}Portefeuille"
      - ""
      - "{info}✎ Informations"
      - " {letters}Tout ce que contient ce"
      - " {letters}portefeuille, sur ce serveur"
      - " {letters}et sur tout le réseau."
      - ""
      - "{info}✦ État"
      - "  {letters_black}· {info}{icon:iron} {letters}Monnaies{letters_black}: {info}%wallet_currencies%"
