# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How one stored currency moves between players.

title: "{primary}&lÖDEMELER {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  transferable:
    slot: 11
    material: "%transferable_material%"
    name: "{primary}&lTRANSFERLER"
    lore:
      - ""
      - "{secondary}Bilgi:"
      - " {letters_black}▎ {letters}Oyuncuların birbirine ödeme yapıp yapamayacağı."
      - ""
      - "{secondary}Durum:"
      - " {letters_black}▎ {letters}Şu an {letters_black}» %transferable_status%"
      - ""
      - "{warning}➥ Değiştirmek için tıkla"
      - ""
