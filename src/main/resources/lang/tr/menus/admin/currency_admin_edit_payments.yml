      - ""
      - "{primary}» Düzenlemek için tıkla"
    actions:
      - "exyliaeconomy:currency_admin_pay_confirm %currency_id%"

  banknotes:
    slot: 15
    material: "%banknotes_material%"
    name: "{letters}Para birimi {letters_black}▸ <gradient:{primary}:{secondary_light}>Banknotlar</gradient>"
    lore:
      - "{letters_black}Para birimi ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}/withdraw ile banknot"
      - " {letters}basılıp basılamayacağı."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:redstone} {letters}Şu an{letters_black}: %banknotes_status%"
      - ""
      - "{primary}» Değiştirmek için tıkla"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% banknotes"

