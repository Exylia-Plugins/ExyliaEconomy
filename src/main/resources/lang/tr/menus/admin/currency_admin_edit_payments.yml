      - "exyliaeconomy:currency_admin_toggle %currency_id% transferable"

  pay-confirm:
    slot: 13
    material: "PAPER"
    name: "{primary}&lÖDEME ONAYI"
    lore:
      - ""
      - "{secondary}Bilgi:"
      - " {letters_black}▎ {letters}Bunun üstündeki /pay önce ödeyene sorar."
      - ""
