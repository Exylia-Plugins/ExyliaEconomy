# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# How one stored currency moves between players.

title: "{primary}&lÖDEMELER {letters_black}» {highlight}%currency_id%"
size: 36
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  transferable:
    slot: 11
    material: "%transferable_material%"
    name: "{letters}Para birimi {letters_black}▸ <gradient:{primary}:{secondary_light}>Transferler</gradient>"
    lore:
      - "{letters_black}Para birimi ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Oyuncuların birbirine"
      - " {letters}ödeme yapıp yapamayacağı."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:redstone} {letters}Şu an{letters_black}: %transferable_status%"
      - ""
      - "{primary}» Değiştirmek için tıkla"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% transferable"

  pay-confirm:
    slot: 13
    material: "PAPER"
    name: "{letters}Para birimi {letters_black}▸ <gradient:{primary}:{secondary_light}>Ödeme onayı</gradient>"
    lore:
      - "{letters_black}Para birimi ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Bunun üstündeki /pay"
      - " {letters}önce ödeyene sorar."
      - ""
      - "{primary}✦ Durum"
