# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Where else one stored currency shows up: its board, the network and Vault.

title: "{primary}&lENTEGRASYONLAR {letters_black}» {highlight}%currency_id%"
size: 27
type: SIMPLE
refresh:
  mode: ON_CLICK
  click_delay: 4

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  leaderboard:
    slot: 12
    material: "%leaderboard_material%"
    name: "{letters}Para birimi {letters_black}▸ <gradient:{primary}:{secondary_light}>Sıralama</gradient>"
    lore:
      - "{letters_black}Para birimi ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Sıralama listesinin ve yer"
      - " {letters}tutucularının çalışıp çalışmadığı."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:redstone} {letters}Şu an{letters_black}: %leaderboard_status%"
      - ""
      - "{primary}{icon:click} Değiştirmek için tıkla"
    actions:
      - "exyliaeconomy:currency_admin_toggle %currency_id% leaderboard"

  networked:
    slot: 13
    material: "%networked_material%"
    name: "{letters}Para birimi {letters_black}▸ <gradient:{primary}:{secondary_light}>Sunucular arası ortak</gradient>"
    lore:
      - "{letters_black}Para birimi ayarı"
